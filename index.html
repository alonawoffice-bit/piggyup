<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e3b2c">
  <meta name="description" content="PiggyUp — אפליקציה לחינוך פיננסי לילדים ולהורים: חיסכון, יעדים, משימות ונקודות.">
  <title>PiggyUp — חינוך פיננסי לילדים</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
/* ============================================================
   PiggyUp — static rebuild · styles
   Mobile-first, Hebrew RTL, light + dark mode via CSS vars
   ============================================================ */
:root {
  --green-950: #082a21;
  --green-900: #0b352a;
  --green-800: #0e3b2c;
  --green-700: #155843;
  --green-600: #1d6b52;
  --cream: #f7f3ea;
  --cream-2: #efe8d8;
  --card: #ffffff;
  --ink: #1e2a24;
  --ink-soft: #42514a;
  --muted: #75847b;
  --line: #e7e0d0;
  --yellow: #f2c14e;
  --yellow-soft: #fdf3d7;
  --red: #e4574f;
  --gold: #e8a13d;
  --mint: #7fb069;
  --shadow: 0 8px 28px rgba(11, 53, 42, 0.12);
  --radius: 22px;
  --nav-h: 76px;
  --font: "Heebo", "Rubik", "Segoe UI", Arial, sans-serif;
}

[data-theme="dark"] {
  --cream: #0f1a16;
  --cream-2: #14231d;
  --card: #16281f;
  --ink: #eef3ee;
  --ink-soft: #c4d2c9;
  --muted: #8fa39a;
  --line: #274138;
  --yellow-soft: #3a2f14;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
}

body {
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: calc(var(--nav-h) + 24px);
  position: relative;
}

/* ---------- Header ---------- */
.app-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 6px;
}
.family-label { font-size: 12px; color: var(--muted); }
.family-name { font-size: 22px; font-weight: 800; margin: 0; }
.mode-toggle {
  display: flex; background: var(--cream-2); border-radius: 999px; padding: 4px;
  border: 1px solid var(--line);
}
.mode-toggle button {
  border: 0; background: transparent; border-radius: 999px;
  padding: 7px 16px; font-family: var(--font); font-size: 14px; font-weight: 700;
  color: var(--muted); cursor: pointer;
}
.mode-toggle button.active { background: var(--green-800); color: #fff; }
.header-toggles { display: flex; gap: 8px; align-items: center; }
.lang-toggle {
  display: flex; background: var(--cream-2); border-radius: 999px; padding: 4px;
  border: 1px solid var(--line);
}
.lang-toggle button {
  border: 0; background: transparent; border-radius: 999px;
  padding: 7px 12px; font-family: var(--font); font-size: 13px; font-weight: 700;
  color: var(--muted); cursor: pointer;
}
.lang-toggle button.active { background: var(--green-800); color: #fff; }

/* ---------- Layout ---------- */
.screen { padding: 8px 16px 16px; animation: fadeUp .25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }

.card {
  background: var(--card); border-radius: var(--radius);
  padding: 18px; margin: 12px 0; box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.card.dark {
  background: linear-gradient(160deg, var(--green-800), var(--green-950));
  color: #fff; border: 0;
}
.card.dark .muted { color: #bcd2c6; }
.section-title { font-size: 17px; font-weight: 800; margin: 18px 4px 4px; }
.muted { color: var(--muted); font-size: 13px; }

/* ---------- Balance / hero cards ---------- */
.balance-card { position: relative; overflow: hidden; }
.balance-top { display: flex; justify-content: space-between; align-items: flex-start; }
.balance-label { font-size: 14px; color: #cfe0d6; }
.balance-amount { font-size: 44px; font-weight: 800; margin: 2px 0 10px; letter-spacing: -1px; }
.money-cols { display: flex; border-top: 1px solid rgba(255,255,255,.18); padding-top: 12px; }
.money-col { flex: 1; text-align: center; }
.money-col + .money-col { border-right: 1px solid rgba(255,255,255,.18); }
.money-col .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 6px; }
.money-col .lbl { font-size: 12px; color: #cfe0d6; }
.money-col .val { font-size: 17px; font-weight: 800; }
/* light-card variant of the money columns */
.card:not(.dark) .money-cols { border-top-color: var(--line); }
.card:not(.dark) .money-col + .money-col { border-right-color: var(--line); }
.card:not(.dark) .money-col .lbl { color: var(--muted); }
.add-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12);
  color: #fff; font-size: 26px; line-height: 1; cursor: pointer;
}

/* ---------- Kids avatar hero ---------- */
.avatar-hero { text-align: center; position: relative; overflow: hidden; }
.points-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
  padding: 6px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
}
.pig-wrap {
  width: 150px; height: 150px; margin: 10px auto 4px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 84px; background: rgba(255,255,255,.08);
  border: 4px solid var(--avatar-ring, #7fb069);
  box-shadow: 0 0 0 8px rgba(255,255,255,.06), 0 0 34px var(--avatar-ring, #7fb069);
  position: relative;
}
.pig-badge {
  position: absolute; bottom: 2px; left: 6px; font-size: 34px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
}
.avatar-name { font-size: 13px; color: #cfe0d6; margin-top: 6px; }
.avatar-level { font-size: 26px; font-weight: 800; margin: 2px 0 8px; }
.progress { height: 10px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; margin: 0 26px; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--yellow), var(--gold)); border-radius: 999px; transition: width .4s; }
.progress.light { background: var(--cream-2); }
.progress-note { font-size: 12px; color: #cfe0d6; margin-top: 6px; }

/* ---------- Goal ring ---------- */
.goal-row { display: flex; align-items: center; gap: 16px; }
.ring {
  width: 76px; height: 76px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 17px; color: var(--ink);
  background: conic-gradient(var(--green-600) var(--pct, 0%), var(--cream-2) 0);
}
.card.dark .ring {
  color: #fff;
  background: conic-gradient(var(--green-600) var(--pct, 0%), rgba(255,255,255,.18) 0);
}

/* ---------- Lists ---------- */
.row-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px; border-bottom: 1px solid var(--line);
}
.row-item:last-child { border-bottom: 0; }
.row-item .grow { flex: 1; }
.row-item .sub { font-size: 12px; color: var(--muted); }
.icon-badge {
  width: 44px; height: 44px; border-radius: 14px; flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: var(--cream-2);
}

/* ---------- Buttons / forms ---------- */
.btn {
  display: inline-block; border: 0; cursor: pointer; font-family: var(--font);
  background: var(--green-800); color: #fff; font-weight: 800; font-size: 15px;
  padding: 12px 22px; border-radius: 14px; width: 100%; margin-top: 8px;
}
.btn.secondary { background: var(--cream-2); color: var(--ink); border: 1px solid var(--line); }
.btn.warn { background: var(--red); }
.btn.small { width: auto; padding: 8px 16px; font-size: 13px; margin-top: 0; }
.btn:disabled { opacity: .5; cursor: default; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.chip {
  border: 1.5px solid var(--green-700); color: var(--green-700);
  background: transparent; border-radius: 999px; padding: 8px 14px;
  font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer;
}
[data-theme="dark"] .chip { color: #9fd4b8; border-color: #2c5a48; }
.chip.active { background: var(--green-800); color: #fff; border-color: var(--green-800); }

.field { margin: 10px 0; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--ink-soft); }
.field input, .field select, .field textarea {
  width: 100%; font-family: var(--font); font-size: 15px;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
  background: var(--card); color: var(--ink);
}
.split-3 { display: flex; gap: 8px; }
.split-3 .field { flex: 1; }

/* ---------- Modal ---------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(8, 42, 33, .55);
  display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  animation: fadeUp .2s ease;
}
.modal {
  background: var(--card); color: var(--ink);
  border-radius: 24px 24px 0 0; padding: 20px 18px 28px;
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
}
.modal h3 { margin: 0 0 8px; font-size: 19px; }

/* ---------- Bottom nav ---------- */
.bottom-nav {
  position: fixed; bottom: 12px; right: 50%; transform: translateX(50%);
  width: min(440px, calc(100% - 32px));
  background: var(--card); border: 1px solid var(--line);
  border-radius: 26px; box-shadow: var(--shadow);
  display: flex; padding: 8px 4px; z-index: 40;
}
.bottom-nav button {
  flex: 1; border: 0; background: transparent; cursor: pointer;
  font-family: var(--font); color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; font-weight: 700; padding: 6px 0;
  border-radius: 18px;
}
.bottom-nav button .ico { font-size: 21px; }
.bottom-nav button.active { color: var(--green-800); background: var(--cream-2); }
[data-theme="dark"] .bottom-nav button.active { color: #9fd4b8; }

/* ---------- Chat ---------- */
.chat-box {
  background: var(--cream-2); border-radius: 18px; padding: 14px;
  max-height: 340px; overflow-y: auto; margin: 10px 0;
}
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; margin: 8px 0; font-size: 14px; line-height: 1.55; }
.msg.bot { background: var(--card); border: 1px solid var(--line); border-bottom-right-radius: 4px; margin-inline-end: auto; }
.msg.user { background: var(--green-800); color: #fff; border-bottom-left-radius: 4px; margin-inline-start: auto; }
.chat-input-row { display: flex; gap: 8px; }
.chat-input-row input { flex: 1; }
.chat-input-row .btn { width: auto; margin-top: 0; padding: 10px 16px; }

/* ---------- Tip card ---------- */
.tip-card {
  background: linear-gradient(135deg, #f7c948, #f0ad3a);
  color: #4a3205; border-radius: var(--radius); padding: 18px; margin: 12px 0;
  box-shadow: var(--shadow); position: relative;
}
.tip-card .tip-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 14px; }
.tip-card p { margin: 8px 0 0; font-size: 15px; line-height: 1.6; font-weight: 600; }

/* ---------- Lock / upgrade ---------- */
.lock-wrap { text-align: center; padding: 30px 10px; }
.lock-wrap .big { font-size: 56px; }
.upgrade-card { border: 2px dashed var(--gold); }

/* ---------- Misc ---------- */
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.pill {
  display: inline-block; font-size: 12px; font-weight: 800;
  background: var(--cream-2); border: 1px solid var(--line);
  padding: 4px 12px; border-radius: 999px; color: var(--ink-soft);
}
.pill.green { background: #e3f2e6; color: #1d6b52; border-color: #bfe3c9; }
[data-theme="dark"] .pill.green { background: #14332a; color: #9fd4b8; }
.pill.gold { background: #fdf3d7; color: #8a5b00; border-color: #f2d98c; }
.kv { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 20px); right: 50%; transform: translateX(50%);
  background: var(--green-900); color: #fff; padding: 12px 22px; border-radius: 14px;
  font-weight: 700; font-size: 14px; z-index: 99; box-shadow: var(--shadow);
  animation: fadeUp .25s ease; max-width: calc(100% - 40px); text-align: center;
}
.demo-note {
  background: var(--yellow-soft); border: 1px solid var(--yellow);
  border-radius: 12px; padding: 10px 14px; font-size: 12.5px; margin: 10px 0; line-height: 1.6;
}
details.howto { margin: 8px 0; font-size: 13px; color: var(--muted); }
details.howto summary { cursor: pointer; font-weight: 700; }

</style>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="text-align:center;padding:40px">PiggyUp דורשת JavaScript פעיל בדפדפן.</p></noscript>
  <script>
/* ============================================================
   PiggyUp — static rebuild: data, content & pure logic helpers
   No DOM usage here — safe to unit-test in Node.
   ============================================================ */
"use strict";

const PIGGY = {};

/* ---------- Avatar levels (4 stages by points) ---------- */
PIGGY.LEVELS = [
  { min: 0,   name: "חבר חדש",      ru: "Новый друг",          badge: "",   ring: "#7fb069" },
  { min: 60,  name: "חוסכת צעירה",   ru: "Юная копилка",        badge: "🌱", ring: "#4caf7d" },
  { min: 150, name: "כוכבת החיסכון", ru: "Звезда сбережений",   badge: "⭐", ring: "#f5c542" },
  { min: 300, name: "אלופת החיסכון", ru: "Чемпионка сбережений", badge: "👑", ring: "#e4574f" },
];

PIGGY.avatarLevelFor = function (points, lang) {
  let idx = 0;
  for (let i = 0; i < PIGGY.LEVELS.length; i++) {
    if (points >= PIGGY.LEVELS[i].min) idx = i;
  }
  const level = PIGGY.LEVELS[idx];
  const next = PIGGY.LEVELS[idx + 1] || null;
  const L = lang || (typeof LANG !== "undefined" ? LANG : "he");
  return {
    index: idx,
    name: L === "ru" && level.ru ? level.ru : level.name,
    badge: level.badge,
    ring: level.ring,
    pointsToNext: next ? next.min - points : 0,
    progressPct: next
      ? Math.round(((points - level.min) / (next.min - level.min)) * 100)
      : 100,
    isMax: !next,
  };
};

/* ---------- Daily tips (rotated by date) ---------- */
PIGGY.TIPS = [
  "כשהילד מקבל כסף — חלקו אותו מיד לשלוש קופות: חיסכון, השקעה והוצאות. הפעולה החזרתית הופכת רעיון להרגל.",
  "תני לילד להחזיק שטרות ומטבעות אמיתיים. מגע פיזי עם כסף בונה הבנה טובה יותר ממספרים על מסך.",
  "קבעי 'יום תקציב' שבועי קצר: 10 דקות שבהן עוברים יחד על מה נכנס ומה יצא.",

  "שאלי 'זה רצון או צורך?' לפני כל קנייה. השאלה הקטנה הזו בונה שריר חשיבה.",
  "תני דוגמה אישית: ספרי לילד על משהו שויתרת עליו כדי לחסוך. ילדים לומדים מחיקוי.",
  "הגדירו יעד חיסכון אחד קטן ומוחשי — לא 'לחסוך', אלא 'לחסוך 80 ש״ח למשחק'.",
  "חגגו כל אבן דרך: 25%, 50%, 75% מהיעד. ההתקדמות הנראית מניעה יותר מהיעד עצמו.",
  "אל תחלצי את הילד כשהכסף נגמר באמצע השבוע — זו ההזדמנות הכי טובה ללמוד תכנון.",
  "למדי את ההבדל בין 'יקר' ל'לא משתלם': מוצר זול שמתקלקל מהר עולה יותר.",
  "שחקו 'חנות' בבית עם מחירים אמיתיים — הילד לומד עודף, תקציב ובחירה.",
  "הסבירי מהי ריבית דריבית במשפט אחד: 'כסף שחוסכים יכול לעבוד ולייצר עוד כסף'.",
  "תני לילד להשוות מחירים בסופר — מי מוצא את אותו המוצר בזול יותר?",
  "כתבו יחד 'רשימת משאלות' במקום לקנות מיד. רוב הפריטים יישכחו תוך שבוע.",
  "דמי כיס קבועים מלמדים תכנון; דמי כיס אקראיים מלמדים לבקש.",
  "אפשרי לילד להרוויח תוספת דרך משימות — הקשר בין מאמץ לכסף הוא שיעור חיים.",
  "למדי לתת: קופה רביעית קטנה לצדקה מלמדת שכסף הוא גם כלי לעזור.",
  "כשהילד טועה עם כסף — אל תנזפי. שאלי: 'מה למדת? מה תעשי אחרת בפעם הבאה?'",
  "הראי לילד קבלה מהסופר והסבירי לאן הולך הכסף של המשפחה.",
  "שחקו 'מה היית קונה ב-100 ש״ח?' — משחק דמיון שמפתח סדרי עדיפויות.",
  "למדי לחכות למבצעים: 'אם זה לא דחוף, נחכה שירד המחיר'.",
  "תני לילד לנהל תקציב קטן לאירוע משפחתי — אחריות אמיתית בונה ביטחון.",
  "הסבירי פרסומות: 'הם רוצים שתקני. תחליטי את אם זה באמת שווה'.",
  "עודדי חיסכון אוטומטי: חלק קבוע מדמי הכיס עובר מיד לחיסכון.",
  "שאלי בסוף כל שבוע: 'על מה את הכי גאה השבוע בניהול הכסף שלך?'",
  "למדי את המושג 'תקציב' כמשחק: מעטפה לכל קטגוריה, וכשהמעטפה ריקה — עוצרים.",

  "תני לילד לבחור בין שתי אפשרויות באותו תקציב — בחירה מלמדת ויתור.",
  "סכמי חודש בטבלה פשוטה: כמה נכנס, כמה יצא, כמה נחסך. שקיפות בונה אמון.",
  "זכרי: המטרה היא לא ילד חסכן — אלא ילד שיודע לקבל החלטות מודעות עם כסף.",
];

/* ---------- Daily tips — Russian version (same order as PIGGY.TIPS) ---------- */
PIGGY.TIPS_RU = [
  "Когда ребёнок получает деньги — сразу разделите их на три копилки: сбережения, инвестиции и траты. Повторяющееся действие превращает идею в привычку.",
  "Дайте ребёнку подержать настоящие купюры и монеты. Физический контакт с деньгами даёт лучшее понимание, чем цифры на экране.",

PIGGY.dailyTipFor = function (date, lang) {
  const d = date instanceof Date ? date : new Date(date);
  const start = new Date(d.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((d - start) / 86400000);
  const L = lang || (typeof LANG !== "undefined" ? LANG : "he");
  const tips = L === "ru" ? PIGGY.TIPS_RU : PIGGY.TIPS;
  return tips[dayOfYear % tips.length];
};

PIGGY.isoWeekNumber = function (date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
};

PIGGY.weeklyGamesFor = function (date) {
  const d = date instanceof Date ? date : new Date(date);
  const week = PIGGY.isoWeekNumber(d);
  const year = d.getFullYear();
  const setIndex = (week * 4) % PIGGY.GAMES.length;
  const games = [];
  for (let i = 0; i < 4; i++) games.push(PIGGY.GAMES[(setIndex + i) % PIGGY.GAMES.length]);
  // next set opens next Monday
  const next = new Date(d);
  const dow = (d.getDay() + 6) % 7; // 0 = Monday
  next.setDate(d.getDate() + (7 - dow));
  return { week, year, games, nextSetDate: next };
};

  const elapsed = now - sub.trialStart;
  if (elapsed < PIGGY.TRIAL_MS) {
    const daysLeft = Math.ceil((PIGGY.TRIAL_MS - elapsed) / 86400000);
    return { state: "trial", daysLeft };

  return { state: "expired", daysLeft: 0 };

PIGGY._hash32 = function (str, seed) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h1 >>> 0) ^ (h2 >>> 0);
};

  }).format(d || new Date());
};

PIGGY.adminCode = function (dateStr) {
  const n = PIGGY._hash32(PIGGY.ADMIN_SALT + "|" + dateStr, 0x9e3779b9) >>> 0;
  return String(n % 1000000).padStart(6, "0");
};

PIGGY.verifyAdminCode = function (code) {
  const c = String(code == null ? "" : code).trim();
  if (!/^\d{6}$/.test(c)) return false;
  const now = Date.now();
  for (let off = 0; off <= 1; off++) {
    if (PIGGY.adminCode(PIGGY._ilDateStr(new Date(now - off * 86400000))) === c) return true;
  }
  return false;
};

}

function t(key) {
  const args = Array.prototype.slice.call(arguments, 1);
  const dict = I18N[LANG] || {};
  let s = dict[key];
  if (s === undefined) s = I18N.he[key];
  if (s === undefined) s = key;
  return String(s).replace(/\{(\d+)\}/g, (m, i) => args[Number(i)] !== undefined ? args[Number(i)] : m);
}

function appLocale() { return LANG === "ru" ? "ru-RU" : "he-IL"; }

/* localized content field: Hebrew in obj[field], Russian in obj[field + "_ru"] */
function loc(obj, field) {
  if (LANG === "ru" && obj[field + "_ru"] !== undefined) return obj[field + "_ru"];
  return obj[field];
}

function setLang(l) {
  LANG = l === "ru" ? "ru" : "he";
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
  document.documentElement.setAttribute("lang", LANG);
  document.documentElement.setAttribute("dir", LANG === "he" ? "rtl" : "ltr");
  document.title = t("meta.title");
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", t("meta.desc"));
  chatMsgs = [];
  chatOptions = [];
  renderApp();
}

/* ---------------- state ---------------- */
function defaultState() {
  return {
    v: 1,
    mode: "parent",
    tab: "home",
    children: [],
    activeChildId: null,
    goals: [],
    tasks: [],
    activity: [],
    sub: { trialStart: null, plan: "none", subs: 0 },
    dark: false,
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    return Object.assign(defaultState(), s);
  } catch (e) {
    return defaultState();
  }
}

let S = loadState();
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ---------------- helpers ---------------- */
function uid() {
  return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function money(n) {
  const v = Number(n) || 0;
  return v.toFixed(2) + "₪";
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(appLocale(), { day: "numeric", month: "long" }) +
    ", " + d.toLocaleTimeString(appLocale(), { hour: "2-digit", minute: "2-digit" });
}
function fmtDay(ts) {
  return new Date(ts).toLocaleDateString(appLocale(), { weekday: "long", day: "numeric", month: "long" });
}
function activeChild() {
  return S.children.find((c) => c.id === S.activeChildId) || null;
}
function childGoals(childId) {
  return S.goals.filter((g) => g.childId === childId);
}
function childTasks(childId, status) {
  let t = S.tasks.filter((t) => !childId || t.childId === childId);
  if (status) t = t.filter((t) => t.status === status);
  return t.sort((a, b) => b.created - a.created);
}
function logActivity(text) {
  S.activity.unshift({ ts: Date.now(), text });
  S.activity = S.activity.slice(0, 40);
}
function toast(msg) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function trialInfo() {
  return PIGGY.trialStatus(S.sub, Date.now());
}
function canAccessGuidance() {
  return PIGGY.hasGuidanceAccess(S.sub, Date.now());
}

/* ---------------- header / nav ---------------- */
const PARENT_TABS = [
  { id: "home",   icon: "🏠" },
  { id: "guide",  icon: "💬" },
  { id: "games",  icon: "🎮" },
  { id: "tasks",  icon: "✓" },
  { id: "manage", icon: "⚙️" },
];
const KIDS_TABS = [
  { id: "home",  icon: "🏠" },
  { id: "tasks", icon: "✓" },
  { id: "games", icon: "🎮" },
];
function tabLabel(id) { return t("tab." + id); }

function renderHeader() {
  const child = activeChild();
  const name = child ? esc(child.name) : t("header.family");
  return `
  <header class="app-header">
    <div>
      <div class="family-label">${t("header.family")}</div>
      <h1 class="family-name">${name}</h1>
    </div>
    <div class="header-toggles">
      <div class="lang-toggle" role="tablist" aria-label="${t("lang.aria")}">
        <button class="${LANG === "he" ? "active" : ""}" onclick="A.setLang('he')">עב</button>
        <button class="${LANG === "ru" ? "active" : ""}" onclick="A.setLang('ru')">РУ</button>
      </div>
      <div class="mode-toggle" role="tablist" aria-label="${t("mode.aria")}">
        <button class="${S.mode === "parent" ? "active" : ""}" onclick="A.setMode('parent')">${t("mode.parent")}</button>
        <button class="${S.mode === "kids" ? "active" : ""}" onclick="A.setMode('kids')">${t("mode.kids")}</button>
      </div>
    </div>
  </header>`;
}

function renderNav() {
  const tabs = S.mode === "parent" ? PARENT_TABS : KIDS_TABS;
  return `<nav class="bottom-nav">` + tabs.map((tb) =>
    `<button class="${S.tab === tb.id ? "active" : ""}" onclick="A.go('${tb.id}')">
       <span class="ico">${tb.icon}</span><span>${tabLabel(tb.id)}</span>
     </button>`
  ).join("") + `</nav>`;
}

/* ---------------- shared bits ---------------- */
function moneyCols(m) {
  return `
  <div class="money-cols">
    <div class="money-col"><div class="lbl"><span class="dot" style="background:#7fb069"></span>${t("money.save")}</div><div class="val">${money(m.save)}</div></div>
    <div class="money-col"><div class="lbl"><span class="dot" style="background:#e8a13d"></span>${t("money.invest")}</div><div class="val">${money(m.invest)}</div></div>
    <div class="money-col"><div class="lbl"><span class="dot" style="background:#e4574f"></span>${S.mode === "kids" ? t("money.spend_kids") : t("money.spend_parent")}</div><div class="val">${money(m.spend)}</div></div>
  </div>`;
}

function goalCard(child) {
  const goals = childGoals(child.id);
  const g = goals[0];
  if (!g) {
    return `<div class="card">
      <div class="section-title" style="margin-top:0">${S.mode === "kids" ? t("goal.next_kids") : t("goal.next_parent")}</div>
      <p class="muted">${t("goal.none_text")}</p>
      ${S.mode === "parent" ? `<button class="btn secondary" onclick="A.go('manage')">${t("goal.goto_manage")}</button>` : ""}
    </div>`;
  }
  const pct = g.target > 0 ? Math.min(100, Math.round((g.saved / g.target) * 100)) : 0;
  return `<div class="card">
    <div class="section-title" style="margin-top:0">${S.mode === "kids" ? t("goal.next_kids") : t("goal.next_parent")}</div>
    <div class="goal-row">
      <div class="ring" style="--pct:${pct}%"><span>${pct}%</span></div>
      <div class="grow">
        <div style="font-weight:800;font-size:16px">${esc(g.title)}</div>
        <div class="muted">${t("goal.saved_of", money(g.saved), money(g.target))}</div>
        ${S.mode === "parent" ? `<button class="btn small" style="margin-top:8px" onclick="A.openDeposit('${g.id}')">${t("goal.deposit")}</button>` : ""}
      </div>
    </div>
  </div>`;
}

function lockScreen(title) {
  const ti = trialInfo();
  const subLine = ti.state === "expired"
    ? t("lock.expired")
    : ti.state === "requested"
    ? t("lock.requested")
    : t("lock.default");
  return `<div class="screen"><div class="card upgrade-card"><div class="lock-wrap">
    <div class="big">🔒</div>
    <h3>${title}</h3>
    <p class="muted">${subLine}<br>${t("lock.body")}</p>
    <button class="btn" onclick="A.openSubscription()">${t("lock.cta")}</button>
  </div></div></div>`;
}

/* ---------------- PARENT: home ---------------- */
function parentHome() {
  const child = activeChild();
  if (!child) return noChildScreen();
  const goals = childGoals(child.id);
  const pending = childTasks(child.id, "pending");
  const total = child.money.save + child.money.invest + child.money.spend;

  const chips = S.children.length > 1
    ? `<div class="chip-row">` + S.children.map((c) =>
        `<button class="chip ${c.id === child.id ? "active" : ""}" onclick="A.selectChild('${c.id}')">${esc(c.name)}</button>`
      ).join("") + `</div>` : "";

  const pendHtml = pending.length === 0
    ? `<div class="empty">${t("home.no_pending")}</div>`
    : pending.map((task) => `
      <div class="row-item">
        <div class="icon-badge">⏳</div>
        <div class="grow"><div style="font-weight:700">${esc(task.title)}</div>
        <div class="sub">${esc(child.name)} · ${t("common.points", task.points)}</div></div>
        <button class="btn small" onclick="A.approveTask('${task.id}')">${t("common.approve")}</button>
      </div>`).join("");

  const actHtml = S.activity.length === 0
    ? `<div class="empty">${t("home.no_activity")}</div>`
    : S.activity.slice(0, 8).map((a) => `
      <div class="row-item">

function chatStart(silent) {
  chatMsgs = [];
  chatOptions = [];
  pushBot(loc(PIGGY.CHAT_NODES.start, "text"));
  showTopics();
  if (!silent) renderChat();
}
function pushBot(text) { chatMsgs.push({ from: "bot", text: chatFill(text) }); }
function pushUser(text) { chatMsgs.push({ from: "user", text }); }
function showTopics() {
  chatOptions = PIGGY.CHAT_TOPICS.map((topic) => ({ label: loc(topic, "label"), next: topic.id + "_1" }));
}
function chatGo(nodeId) {
  const node = PIGGY.CHAT_NODES[nodeId];
  if (!node) return;
  if (nodeId === "games_hint") {
    pushBot(t("chat.games_hint"));
    chatOptions = [{ label: t("chat.back_topics"), next: "__topics" }];
    renderChat();
    return;
  }
  pushBot(loc(node, "text"));
  if (node.options === "topics") showTopics();
  else chatOptions = node.options.map((o) => ({ label: loc(o, "label"), next: o.next }));
  renderChat();
}
function renderChat() {
  const box = document.getElementById("chatBox");
  if (!box) return;
  box.innerHTML = chatMsgs.map((m) =>
    `<div class="msg ${m.from}">${esc(m.text)}</div>`).join("");
  box.scrollTop = box.scrollHeight;
  const chips = document.getElementById("chatChips");
  if (chips) {
    chips.innerHTML = chatOptions.map((o, i) =>
      `<button class="chip" onclick="A.chatChoose(${i})">${esc(o.label)}</button>`).join("");
  }
}

/* ---------------- actions ---------------- */
const A = {
  go(tab) { S.tab = tab; save(); renderApp(); window.scrollTo(0, 0); },
  openSubscription() { S.mode = "parent"; S.tab = "manage"; save(); renderApp(); window.scrollTo(0, 0); },
  setMode(mode) {
    S.mode = mode;
    const tabs = mode === "parent" ? PARENT_TABS : KIDS_TABS;
    if (!tabs.find((t) => t.id === S.tab)) S.tab = "home";
    save(); renderApp(); window.scrollTo(0, 0);
  },
  selectChild(id) { S.activeChildId = id; save(); renderApp(); },
  closeModal,
  setLang,

  createChild() {
    const inp = document.getElementById("ncName");
    const name = (inp.value || "").trim();
    if (!name) { toast(t("toast.child_name")); return; }
    const c = { id: uid(), name, points: 0, money: { save: 0, invest: 0, spend: 0 } };
    S.children.push(c);
    if (!S.activeChildId) S.activeChildId = c.id;
    logActivity(t("log.child_created", name));
    save(); renderApp();
    toast(t("toast.welcome", name));
  },

  openAddMoney: addMoneyModal,
  doAddMoney(childId) {
    const c = S.children.find((x) => x.id === childId);
    const s = Math.max(0, Number(document.getElementById("amSave").value) || 0);
    const i = Math.max(0, Number(document.getElementById("amInvest").value) || 0);
    const p = Math.max(0, Number(document.getElementById("amSpend").value) || 0);
    if (s + i + p <= 0) { toast(t("toast.amount")); return; }
    c.money.save += s; c.money.invest += i; c.money.spend += p;
    logActivity(t("log.money_added", money(s + i + p), c.name));
    save(); closeModal(); renderApp();
    toast(t("toast.money_added"));
  },

  openGoal: goalModal,
  doCreateGoal(childId) {
    const title = (document.getElementById("ngTitle").value || "").trim();
    const target = Math.max(1, Number(document.getElementById("ngTarget").value) || 0);
    if (!title) { toast(t("toast.goal_name")); return; }
    S.goals.push({ id: uid(), childId, title, target, saved: 0 });
    logActivity(t("log.goal_created", title, money(target)));
    save(); closeModal(); renderApp();
    toast(t("toast.goal_created"));
  },
  openDeposit: depositModal,
  doDeposit(goalId) {
    const g = S.goals.find((x) => x.id === goalId);
    const c = S.children.find((x) => x.id === g.childId);
    const amt = Math.max(0, Number(document.getElementById("depAmt").value) || 0);
    if (amt <= 0 || amt > c.money.save) { toast(t("toast.bad_amount")); return; }
    c.money.save -= amt; g.saved += amt;
    logActivity(t("log.deposited", money(amt), g.title));
    save(); closeModal(); renderApp();
    toast(t("toast.deposited"));
  },

  createTask() {
    const childId = document.getElementById("ntChild").value;
    const title = (document.getElementById("ntTitle").value || "").trim();
    const points = Math.max(1, Number(document.getElementById("ntPoints").value) || 10);
    if (!title) { toast(t("toast.task_desc")); return; }
    S.tasks.push({ id: uid(), childId, title, points, status: "open", created: Date.now() });
    save(); renderApp();
    toast(t("toast.task_added"));
  },
  completeTask(id) {
    const tsk = S.tasks.find((x) => x.id === id);
    tsk.status = "pending";
    save(); renderApp();
    toast(t("toast.task_done"));
  },
  approveTask(id) {
    const tsk = S.tasks.find((x) => x.id === id);
    const c = S.children.find((x) => x.id === tsk.childId);
    tsk.status = "approved";
    c.points += tsk.points;
    logActivity(t("log.task_approved", c.name, tsk.title, tsk.points));
    save(); renderApp();
    toast(t("toast.approved", tsk.points, c.name));
  },

  startTrial() {
    const ti = trialInfo();
    if (ti.state !== "none") return; // ניתן להתחיל הדגמה פעם אחת בלבד
    S.sub.trialStart = Date.now();
    S.sub.plan = "trial";
    if (window.__piggyPing) window.__piggyPing("trial_started");
    save(); renderApp();
    toast(t("toast.trial_started"));
  },
  // שלב 2: המשתמש רק *מבקש* מנוי בתשלום — אין הפעלה אוטומטית, אין חיוב.
  // הלחיצה פותחת וואטסאפ עם הודעה מוכנה לאלונה; ההפעלה מתבצעת רק עם קוד
  // מאלונה (לאחר אישורה והשלמת תשלום אמיתי).
  openWhatsAppRequest() {
    var nameEl = document.getElementById("reqName");
    var phoneEl = document.getElementById("reqPhone");
    var name = nameEl ? nameEl.value.trim() : "";
    var phone = phoneEl ? phoneEl.value.trim() : "";
    var msg = t("wa.msg");
    if (name) msg += "\n" + t("wa.name_line", name);
    if (phone) msg += "\n" + t("wa.phone_line", phone);
    window.open("https://wa.me/972506575168?text=" + encodeURIComponent(msg), "_blank");
  },
  requestSubscription(resend) {
    const ti = trialInfo();
    if (!resend) {
      if (ti.state !== "expired") return; // בקשה אפשרית רק אחרי סיום ההדגמה
      S.sub.plan = "requested";
      S.sub.requestedAt = Date.now();
      save(); renderApp();
    }
    A.openWhatsAppRequest();
    toast(t("toast.wa_opened"));
  },
  activateWithCode() {
    const input = document.getElementById("admin-code-input");
    const code = input ? input.value.trim() : "";
    if (!PIGGY.verifyAdminCode(code)) {
      toast(t("toast.bad_code"));
      return;
    }
    S.sub.plan = "premium";
    S.sub.activatedBy = "admin-code";
    S.sub.activatedAt = Date.now();
    S.sub.subs += 1;
    save(); renderApp();
    toast(t("toast.sub_activated"));
  },
  toggleDark() {
    S.dark = !S.dark;
    document.documentElement.setAttribute("data-theme", S.dark ? "dark" : "light");
    save();
  },
  resetAll() {
    if (!confirm(t("confirm.reset"))) return;
    localStorage.removeItem(LS_KEY);
    S = defaultState();
    chatMsgs = [];
    renderApp();
  },

  /* chat */
  chatChoose(i) {
    const o = chatOptions[i];
    if (!o) return;
    pushUser(o.label);
    if (o.next === "__topics") { pushBot(t("chat.more_help")); showTopics(); }
    else chatGo(o.next);
  },
  chatSend() {
    const inp = document.getElementById("chatInput");
    const text = (inp.value || "").trim();
    if (!text) return;
    pushUser(text);
    inp.value = "";
    const nodeId = PIGGY.chatReplyFor(text, LANG);
    if (nodeId) chatGo(nodeId);
    else {
      pushBot(t("chat.fallback"));
      showTopics();
      renderChat();
    }
  },
};
window.A = A;

/* ---------------- render root ---------------- */
function renderApp() {
  document.documentElement.setAttribute("data-theme", S.dark ? "dark" : "light");
  document.documentElement.setAttribute("dir", LANG === "he" ? "rtl" : "ltr");
  document.documentElement.setAttribute("lang", LANG);
  const root = document.getElementById("app");
  let screen = "";
  if (S.mode === "parent") {
    screen =
      S.tab === "home" ? parentHome() :
      S.tab === "guide" ? parentGuide() :
      S.tab === "games" ? parentGames() :
      S.tab === "tasks" ? parentTasks() :
      parentManage();
  } else {
    screen =
      S.tab === "tasks" ? kidsTasks() :
      S.tab === "games" ? kidsGames() :
      kidsHome();
  }
  root.innerHTML = renderHeader() + screen + renderNav();
  if (S.tab === "guide" && S.mode === "parent" && canAccessGuidance()) renderChat();
  save();
}

document.addEventListener("DOMContentLoaded", () => setLang(LANG));

</script>
<script>
// PiggyUp ping beacon — anonymous usage analytics (event type + timestamp only, no PII)
(function(){
  var PING_URL = "https://script.google.com/macros/s/AKfycbwYR5sDa-c0kfUpZiGmVPTPHMLf_vn1QmGELKxNXhzB0SZQ2iAe9lYX1lKZGCEFMx3r/exec";
  function ping(event){
    try {
      var body = "event=" + encodeURIComponent(event);
      if (navigator.sendBeacon) {
        navigator.sendBeacon(PING_URL, new Blob([body], {type: "application/x-www-form-urlencoded"}));
      } else {
        fetch(PING_URL, {method: "POST", mode: "no-cors", keepalive: true,
          headers: {"Content-Type": "application/x-www-form-urlencoded"}, body: body});
      }
    } catch (e) {}
  }
  window.__piggyPing = ping;
  try {
    if (!sessionStorage.getItem("pu_ping_visit")) {
      sessionStorage.setItem("pu_ping_visit", "1");
      ping("visit");
    }
  } catch (e) { ping("visit"); }
})();
</script>
