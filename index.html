/* ============================================================
   PiggyUp — static rebuild · styles
   Mobile-first, Hebrew RTL, light + dark mode via CSS vars
   ============================================================ */
:root {
  --green-950: #082a21;
  --green-900: #0b352a;
  --green-800: #0e3b2c;
  --green-700: #155843;
  --green-600: #1d6b52;
  --cream: #f7f3ea;
  --cream-2: #efe8d8;
  --card: #ffffff;
  --ink: #1e2a24;
  --ink-soft: #42514a;
  --muted: #75847b;
  --line: #e7e0d0;
  --yellow: #f2c14e;
  --yellow-soft: #fdf3d7;
  --red: #e4574f;
  --gold: #e8a13d;
  --mint: #7fb069;
  --shadow: 0 8px 28px rgba(11, 53, 42, 0.12);
  --radius: 22px;
  --nav-h: 76px;
  --font: "Rubik", system-ui, "Segoe UI", Arial, sans-serif;
}

[data-theme="dark"] {
  --cream: #0f1a16;
  --cream-2: #14231d;
  --card: #16281f;
  --ink: #eef3ee;
  --ink-soft: #c4d2c9;
  --muted: #8fa39a;
  --line: #274138;
  --yellow-soft: #3a2f14;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  font-family: var(--font);
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
}

body {
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: calc(var(--nav-h) + 24px);
  position: relative;
}

/* ---------- Header ---------- */
.app-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 6px;
}
.family-label { font-size: 12px; color: var(--muted); }
.family-name { font-size: 22px; font-weight: 800; margin: 0; }
.mode-toggle {
  display: flex; background: var(--cream-2); border-radius: 999px; padding: 4px;
  border: 1px solid var(--line);
}
.mode-toggle button {
  border: 0; background: transparent; border-radius: 999px;
  padding: 7px 16px; font-family: var(--font); font-size: 14px; font-weight: 700;
  color: var(--muted); cursor: pointer;
}
.mode-toggle button.active { background: var(--green-800); color: #fff; }
.header-toggles { display: flex; gap: 8px; align-items: center; }
.lang-toggle {
  display: flex; background: var(--cream-2); border-radius: 999px; padding: 4px;
  border: 1px solid var(--line);
}
.lang-toggle button {
  border: 0; background: transparent; border-radius: 999px;
  padding: 7px 12px; font-family: var(--font); font-size: 13px; font-weight: 700;
  color: var(--muted); cursor: pointer;
}
.lang-toggle button.active { background: var(--green-800); color: #fff; }

/* ---------- Layout ---------- */
.screen { padding: 8px 16px 16px; animation: fadeUp .25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }

.card {
  background: var(--card); border-radius: var(--radius);
  padding: 18px; margin: 12px 0; box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.card.dark {
  background: linear-gradient(160deg, var(--green-800), var(--green-950));
  color: #fff; border: 0;
}
.card.dark .muted { color: #bcd2c6; }
.section-title { font-size: 17px; font-weight: 800; margin: 18px 4px 4px; }
.muted { color: var(--muted); font-size: 13px; }

/* ---------- Balance / hero cards ---------- */
.balance-card { position: relative; overflow: hidden; }
.balance-top { display: flex; justify-content: space-between; align-items: flex-start; }
.balance-label { font-size: 14px; color: #cfe0d6; }
.balance-amount { font-size: 44px; font-weight: 800; margin: 2px 0 10px; letter-spacing: -1px; }
.money-cols { display: flex; border-top: 1px solid rgba(255,255,255,.18); padding-top: 12px; }
.money-col { flex: 1; text-align: center; }
.money-col + .money-col { border-right: 1px solid rgba(255,255,255,.18); }
.money-col .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 6px; }
.money-col .lbl { font-size: 12px; color: #cfe0d6; }
.money-col .val { font-size: 17px; font-weight: 800; }
/* light-card variant of the money columns */
.card:not(.dark) .money-cols { border-top-color: var(--line); }
.card:not(.dark) .money-col + .money-col { border-right-color: var(--line); }
.card:not(.dark) .money-col .lbl { color: var(--muted); }
.add-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12);
  color: #fff; font-size: 26px; line-height: 1; cursor: pointer;
}

/* ---------- Kids avatar hero ---------- */
.avatar-hero { text-align: center; position: relative; overflow: hidden; }
.points-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
  padding: 6px 16px; border-radius: 999px; font-weight: 800; font-size: 14px;
}
.pig-wrap {
  width: 150px; height: 150px; margin: 10px auto 4px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 84px; background: rgba(255,255,255,.08);
  border: 4px solid var(--avatar-ring, #7fb069);
  box-shadow: 0 0 0 8px rgba(255,255,255,.06), 0 0 34px var(--avatar-ring, #7fb069);
  position: relative;
}
.pig-badge {
  position: absolute; bottom: 2px; left: 6px; font-size: 34px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
}
.avatar-name { font-size: 13px; color: #cfe0d6; margin-top: 6px; }
.avatar-level { font-size: 26px; font-weight: 800; margin: 2px 0 8px; }
.progress { height: 10px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; margin: 0 26px; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--yellow), var(--gold)); border-radius: 999px; transition: width .4s; }
.progress.light { background: var(--cream-2); }
.progress-note { font-size: 12px; color: #cfe0d6; margin-top: 6px; }

/* ---------- Goal ring ---------- */
.goal-row { display: flex; align-items: center; gap: 16px; }
.ring {
  width: 76px; height: 76px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 17px; color: var(--ink);
  background: conic-gradient(var(--green-600) var(--pct, 0%), var(--cream-2) 0);
}
.card.dark .ring {
  color: #fff;
  background: conic-gradient(var(--green-600) var(--pct, 0%), rgba(255,255,255,.18) 0);
}

/* ---------- Lists ---------- */
.row-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px; border-bottom: 1px solid var(--line);
}
.row-item:last-child { border-bottom: 0; }
.row-item .grow { flex: 1; }
.row-item .sub { font-size: 12px; color: var(--muted); }
.icon-badge {
  width: 44px; height: 44px; border-radius: 14px; flex: none;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: var(--cream-2);
}

/* ---------- Buttons / forms ---------- */
.btn {
  display: inline-block; border: 0; cursor: pointer; font-family: var(--font);
  background: var(--green-800); color: #fff; font-weight: 800; font-size: 15px;
  padding: 12px 22px; border-radius: 14px; width: 100%; margin-top: 8px;
}
.btn.secondary { background: var(--cream-2); color: var(--ink); border: 1px solid var(--line); }
.btn.warn { background: var(--red); }
.btn.small { width: auto; padding: 8px 16px; font-size: 13px; margin-top: 0; }
.btn:disabled { opacity: .5; cursor: default; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.chip {
  border: 1.5px solid var(--green-700); color: var(--green-700);
  background: transparent; border-radius: 999px; padding: 8px 14px;
  font-family: var(--font); font-size: 13px; font-weight: 700; cursor: pointer;
}
[data-theme="dark"] .chip { color: #9fd4b8; border-color: #2c5a48; }
.chip.active { background: var(--green-800); color: #fff; border-color: var(--green-800); }

.field { margin: 10px 0; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--ink-soft); }
.field input, .field select, .field textarea {
  width: 100%; font-family: var(--font); font-size: 15px;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
  background: var(--card); color: var(--ink);
}
.split-3 { display: flex; gap: 8px; }
.split-3 .field { flex: 1; }

/* ---------- Modal ---------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(8, 42, 33, .55);
  display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  animation: fadeUp .2s ease;
}
.modal {
  background: var(--card); color: var(--ink);
  border-radius: 24px 24px 0 0; padding: 20px 18px 28px;
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
}
.modal h3 { margin: 0 0 8px; font-size: 19px; }

/* ---------- Bottom nav ---------- */
.bottom-nav {
  position: fixed; bottom: 12px; right: 50%; transform: translateX(50%);
  width: min(440px, calc(100% - 32px));
  background: var(--card); border: 1px solid var(--line);
  border-radius: 26px; box-shadow: var(--shadow);
  display: flex; padding: 8px 4px; z-index: 40;
}
.bottom-nav button {
  flex: 1; border: 0; background: transparent; cursor: pointer;
  font-family: var(--font); color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; font-weight: 700; padding: 6px 0;
  border-radius: 18px;
}
.bottom-nav button .ico { font-size: 21px; }
.bottom-nav button.active { color: var(--green-800); background: var(--cream-2); }
[data-theme="dark"] .bottom-nav button.active { color: #9fd4b8; }

/* ---------- Chat ---------- */
.chat-box {
  background: var(--cream-2); border-radius: 18px; padding: 14px;
  max-height: 340px; overflow-y: auto; margin: 10px 0;
}
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; margin: 8px 0; font-size: 14px; line-height: 1.55; }
.msg.bot { background: var(--card); border: 1px solid var(--line); border-bottom-right-radius: 4px; margin-inline-end: auto; }
.msg.user { background: var(--green-800); color: #fff; border-bottom-left-radius: 4px; margin-inline-start: auto; }
.chat-input-row { display: flex; gap: 8px; }
.chat-input-row input { flex: 1; }
.chat-input-row .btn { width: auto; margin-top: 0; padding: 10px 16px; }

/* ---------- Tip card ---------- */
.tip-card {
  background: linear-gradient(135deg, #f7c948, #f0ad3a);
  color: #4a3205; border-radius: var(--radius); padding: 18px; margin: 12px 0;
  box-shadow: var(--shadow); position: relative;
}
.tip-card .tip-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 14px; }
.tip-card p { margin: 8px 0 0; font-size: 15px; line-height: 1.6; font-weight: 600; }

/* ---------- Lock / upgrade ---------- */
.lock-wrap { text-align: center; padding: 30px 10px; }
.lock-wrap .big { font-size: 56px; }
.upgrade-card { border: 2px dashed var(--gold); }

/* ---------- Misc ---------- */
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.pill {
  display: inline-block; font-size: 12px; font-weight: 800;
  background: var(--cream-2); border: 1px solid var(--line);
  padding: 4px 12px; border-radius: 999px; color: var(--ink-soft);
}
.pill.green { background: #e3f2e6; color: #1d6b52; border-color: #bfe3c9; }
[data-theme="dark"] .pill.green { background: #14332a; color: #9fd4b8; }
.pill.gold { background: #fdf3d7; color: #8a5b00; border-color: #f2d98c; }
.kv { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 20px); right: 50%; transform: translateX(50%);
  background: var(--green-900); color: #fff; padding: 12px 22px; border-radius: 14px;
  font-weight: 700; font-size: 14px; z-index: 99; box-shadow: var(--shadow);
  animation: fadeUp .25s ease; max-width: calc(100% - 40px); text-align: center;
}
.demo-note {
  background: var(--yellow-soft); border: 1px solid var(--yellow);
  border-radius: 12px; padding: 10px 14px; font-size: 12.5px; margin: 10px 0; line-height: 1.6;
}
details.howto { margin: 8px 0; font-size: 13px; color: var(--muted); }
details.howto summary { cursor: pointer; font-weight: 700; }

  font-weight: 800;
  font-display: swap;
  src: url('fonts/rubik-latin-800.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
/* ============ PiggyUp UPGRADE CORE v2 — CSS ============ */

/* Focus visibility (a11y) */
.upg-focusable:focus-visible,
button:focus-visible, a:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--yellow);
  outline-offset: 2px;
}

/* Reduced motion: respect the user */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* Small utilities */
.upg-muted { color: var(--muted); font-size: 13px; }
.upg-row { display: flex; gap: 8px; align-items: center; }
.upg-grow { flex: 1; }
.upg-center { text-align: center; }
.upg-mt { margin-top: 12px; }
.upg-badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  background: var(--yellow-soft); color: var(--ink);
  font-size: 12px; font-weight: 700;
}
.upg-err {
  background: #fdecea; color: #a33; border: 1px solid #f3c1bd;
  border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 8px 0;
}
[data-theme="dark"] .upg-err { background: #3a1f1d; color: #f2b8b3; border-color: #5c2f2c; }
.upg-ok {
  background: #e7f4ea; color: #1d6b52; border: 1px solid #bfe3c9;
  border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 8px 0;
}
.upg-skel {
  border-radius: 12px; background: var(--cream-2); min-height: 54px;
  animation: upgPulse 1.2s ease-in-out infinite;
}
@keyframes upgPulse { 50% { opacity: .55; } }

/* Celebration (CSS-only confetti, no libs) */
.upg-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
.upg-confetti i {
  position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px;
  animation: upgFall 2.6s ease-in forwards;
}
@keyframes upgFall {
  to { transform: translateY(105vh) rotate(720deg); opacity: .9; }
}

/* Print: home kit */
@media print {
  body { max-width: none; background: #fff; }
  .app-header, .bottom-nav, .mode-toggle, .no-print { display: none !important; }
  .print-page { page-break-after: always; }
  .print-page:last-child { page-break-after: avoid; }
  .card { box-shadow: none; border: 2px solid #0e3b2c; }
}

/* schema-guard refresh banner (cross-tab / mixed-version protection) */
#upgRefreshBanner {
  position: sticky; top: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px; font-size: 14px; font-weight: 700;
  background: #fff3cd; color: #664d03; border-bottom: 2px solid #ffda6a;
}
#upgRefreshBanner .btn.small { white-space: nowrap; }
html[data-theme="dark"] #upgRefreshBanner { background: #4a3b00; color: #ffe69c; border-bottom-color: #997404; }

/* language switcher stays clickable above an open modal (modal-back is z-50) */
.lang-toggle { position: relative; z-index: 60; }

/* ===== chunk: 10-money ===== */
/* ============================================================
   PiggyUp MONEY CORE v2 (10-money) — styles
   Mobile-first, RTL/LTR-safe (logical properties only),
   touch targets >= 44px, theme-aware via CSS vars.
   ============================================================ */

/* ---------- parent home ---------- */
.upg-greet { font-size: 20px; font-weight: 800; margin: 2px 0 10px; }

.upg-box-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-top: 14px;
}
.upg-box-card {
  background: rgba(255,255,255,.10);
  border-radius: 16px; padding: 12px 6px;
  text-align: center;
  border-top: 4px solid var(--box-color, #7fb069);
  min-height: 44px;
}
.card:not(.dark) .upg-box-card { background: var(--cream-2); }
.upg-box-ico { font-size: 26px; line-height: 1.2; }
.upg-box-name {
  font-size: 12px; font-weight: 700; margin-top: 4px;
  color: #dcebe2; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.card:not(.dark) .upg-box-name { color: var(--ink-soft); }
.upg-box-amt { font-size: 16px; font-weight: 800; margin-top: 2px; }

.upg-progress {
  height: 14px; background: rgba(255,255,255,.18);
  border-radius: 999px; overflow: hidden; margin-top: 10px;
}
.card:not(.dark) .upg-progress { background: var(--cream-2); }
.upg-progress > i {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--mint), var(--gold));
  transition: width .3s ease;
}

/* ---------- quick actions & tools ---------- */
.upg-quick-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin: 8px 0 4px;
}
.upg-quick {
  min-height: 72px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink);
  border-radius: 16px; font-family: var(--font);
  font-weight: 800; font-size: 13px; cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 5px; padding: 10px 6px;
}
.upg-quick .q-ico { font-size: 24px; line-height: 1; }
.upg-quick:active { transform: scale(.97); }

.upg-tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.upg-tool {
  min-height: 52px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink);
  border-radius: 14px; font-family: var(--font);
  font-weight: 700; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 10px 8px;
}
.upg-tool:active { transform: scale(.98); }

/* ---------- segmented mode toggle ---------- */
.upg-seg { display: flex; gap: 8px; margin: 8px 0; }
.upg-seg button {
  flex: 1; min-height: 48px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink); font-family: var(--font);
  font-weight: 800; font-size: 14px; cursor: pointer;
}
.upg-seg button.on {
  background: var(--green-800); color: #fff;
  border-color: var(--green-800);
}

/* ---------- live split preview ---------- */
.upg-preview {
  background: var(--cream-2); border-radius: 14px;
  padding: 12px 14px; margin: 10px 0; font-size: 14px;
}
.upg-preview .pr-row {
  display: flex; justify-content: space-between;
  align-items: center; padding: 4px 0; gap: 8px;
}
.upg-preview .pr-total {
  font-weight: 800; border-top: 1px solid var(--line);
  margin-top: 6px; padding-top: 8px;
}
.upg-preview .pr-ok { color: var(--green-600); font-weight: 800; }
.upg-preview .pr-bad { color: var(--red); font-weight: 800; }
.upg-preview .pr-head { font-weight: 800; margin-bottom: 4px; }

/* ---------- ledger ---------- */
.upg-ledger-row {
  display: flex; gap: 10px; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.upg-ledger-row:last-child { border-bottom: 0; }
.upg-ledger-ico {
  font-size: 24px; width: 44px; height: 44px; flex: 0 0 44px;
  display: flex; align-items: center; justify-content: center;
  background: var(--cream-2); border-radius: 12px;
}
.upg-ledger-main { flex: 1; min-width: 0; }
.upg-ledger-amt { font-weight: 800; font-size: 15px; white-space: nowrap; }
.upg-ledger-amt.pos { color: var(--green-600); }
.upg-ledger-amt.neg { color: var(--red); }
.upg-ledger-date { font-size: 12px; color: var(--muted); white-space: nowrap; }
.upg-ledger-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.upg-tag {
  display: inline-block; font-size: 11px; font-weight: 800;
  background: var(--yellow-soft); color: var(--ink);
  border-radius: 999px; padding: 2px 8px;
  margin-inline-start: 6px;
}
.upg-corr-btn {
  min-height: 44px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink-soft);
  border-radius: 12px; font-family: var(--font);
  font-size: 13px; font-weight: 700; cursor: pointer;
  padding: 8px 14px;
}
.upg-confirm-box {
  background: var(--yellow-soft); border: 1px solid var(--gold);
  border-radius: 14px; padding: 10px 12px; margin: 8px 0;
  font-size: 14px;
}
.upg-confirm-box .upg-row-btns { display: flex; gap: 8px; margin-top: 8px; }
.upg-confirm-box .upg-row-btns .btn { margin-top: 0; }

/* ---------- boxes editor ---------- */
.upg-box-edit {
  border: 1.5px solid var(--line); border-radius: 16px;
  padding: 12px; margin: 10px 0;
}
.upg-box-edit.archived { opacity: .8; background: var(--cream-2); }
.upg-box-prev {
  width: 52px; height: 52px; flex: 0 0 52px;
  border-radius: 16px; display: flex;
  align-items: center; justify-content: center;
  font-size: 28px; color: #fff;
}
.upg-pick-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.upg-ico-btn {
  width: 48px; height: 48px; font-size: 24px;
  border-radius: 14px; border: 2px solid var(--line);
  background: var(--card); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.upg-ico-btn.on { border-color: var(--green-700); background: var(--yellow-soft); }
.upg-swatch {
  width: 48px; height: 48px; border-radius: 50%;
  border: 3px solid transparent; cursor: pointer; padding: 0;
}
.upg-swatch.on { border-color: var(--ink); }
.upg-flex { display: flex; gap: 10px; align-items: center; }

/* ---------- invest rule ---------- */
.upg-radio-row {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px; margin: 8px 0; cursor: pointer;
  min-height: 44px; font-size: 14px; font-weight: 600;
}
.upg-radio-row input { width: 22px; height: 22px; margin-top: 2px; flex: 0 0 22px; }
.upg-disclaimer {
  background: var(--yellow-soft); border: 1px solid var(--gold);
  border-radius: 12px; padding: 10px 12px;
  font-size: 13px; margin: 12px 0; line-height: 1.5;
}

/* ---------- modal form polish ---------- */
.upg-amount-row { display: flex; gap: 8px; align-items: stretch; }
.upg-amount-row .field { flex: 1; }
.upg-amount-row input { font-size: 20px; font-weight: 800; text-align: center; }
.upg-quick-amounts { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
.upg-quick-amounts .chip { min-height: 44px; padding: 8px 18px; font-size: 14px; }
.upg-manual-rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.upg-manual-rows input { text-align: center; font-weight: 800; }
@media (max-width: 360px) {
  .upg-manual-rows { grid-template-columns: 1fr; }
  .upg-box-grid { gap: 6px; }
  .upg-box-amt { font-size: 14px; }
}

/* ===== chunk: 20-missions ===== */
/* ============ PiggyUp UPGRADE 20 — Goals + Tasks + Missions ============ */

/* --- goal progress with milestone markers --- */
.upg-goal { position: relative; }
.upg-goal-head { display: flex; align-items: center; gap: 10px; }
.upg-goal-ico { font-size: 30px; line-height: 1; }
.upg-goal-title { font-weight: 800; font-size: 16px; }
.upg-goal-amounts { color: var(--muted); font-size: 13px; margin-top: 2px; }
.upg-star {
  margin-inline-start: auto;
  min-width: 44px; min-height: 44px;
  border: 0; border-radius: 12px; background: var(--cream-2);
  font-size: 22px; cursor: pointer; line-height: 1;
}
.upg-star.on { background: var(--yellow-soft); }
.upg-pbar {
  position: relative; height: 14px; border-radius: 999px;
  background: var(--cream-2); margin: 12px 0 4px; overflow: visible;
}
.card.dark .upg-pbar { background: rgba(255,255,255,.15); }
.upg-pbar > .upg-fill {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--yellow), var(--gold));
  transition: width .5s;
}
.upg-ms {
  position: absolute; top: -3px; bottom: -3px; width: 3px;
  inset-inline-start: var(--pos);
  transform: translateX(0);
  background: var(--muted); opacity: .55; border-radius: 2px;
}
[dir="rtl"] .upg-ms { transform: translateX(50%); }
[dir="ltr"] .upg-ms { transform: translateX(-50%); }
.upg-ms.hit { background: var(--gold); opacity: 1; box-shadow: 0 0 6px var(--gold); }
.upg-ms-lbls { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.upg-goal-done {
  margin-top: 10px; padding: 10px 12px; border-radius: 12px;
  background: var(--yellow-soft); font-weight: 800; text-align: center;
}
.upg-other-goals { margin-top: 10px; border-top: 1px dashed var(--muted); padding-top: 8px; }
.upg-other-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }

/* --- icon picker in goal modal --- */
.upg-icon-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.upg-icon-grid label {
  min-width: 48px; min-height: 48px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; border-radius: 12px; background: var(--cream-2);
  cursor: pointer; border: 2px solid transparent;
}
.upg-icon-grid input { position: absolute; opacity: 0; pointer-events: none; }
.upg-icon-grid input:checked + span,
.upg-icon-grid label:has(input:checked) { border-color: var(--gold); background: var(--yellow-soft); }

/* --- mission card (parent dashboard) --- */
.upg-mission { border-inline-start: 5px solid var(--gold); }
.upg-mission-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.upg-mission-day { font-size: 12px; color: var(--muted); font-weight: 700; }
.upg-mission-title { font-size: 17px; font-weight: 800; margin: 6px 0; }
.upg-mission-block { margin: 8px 0; font-size: 14px; }
.upg-mission-block b { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.upg-mission-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.upg-mission-actions .btn { flex: 1; min-height: 48px; }

/* --- kids mission rows --- */
.upg-kid-mission { border-inline-start: 4px solid var(--gold); }

/* --- achievements --- */
.upg-ach-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.upg-ach {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--yellow-soft); border-radius: 999px;
  padding: 8px 14px; font-size: 13px; font-weight: 800; min-height: 44px;
}

/* --- reject inline form --- */
.upg-reject-form { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.upg-reject-form input { flex: 1; min-width: 0; min-height: 44px; }
.upg-reject-note {
  margin-top: 6px; font-size: 13px; color: var(--muted);
  background: var(--cream-2); border-radius: 10px; padding: 8px 10px;
}

/* --- task meta bits --- */
.upg-task-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.upg-task-reward { font-weight: 800; color: var(--gold); }

/* ===== chunk: 30-care ===== */
/* ============================================================
   PiggyUp CARE module (30-care) — subscription, support,
   legal, data, print kit, family league.
   Mobile-first, >=44px touch targets, RTL/LTR safe
   (logical properties; no physical left/right).
   ============================================================ */

/* --- touch targets --- */
.upg-scope .btn,
.upg-scope .chip,
.upg-scope .upg-acc-head,
.upg-scope .upg-legal-btn,
.modal .btn {
  min-height: 44px;
}
.upg-scope .btn.small,
.upg-scope .btn.small.secondary {
  min-height: 44px;
}

/* --- buttons row --- */
.upg-btn-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.upg-btn-row .btn {
  flex: 1 1 auto;
}

/* --- support buttons --- */
.upg-support-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: 1fr;
}
@media (min-width: 520px) {
  .upg-support-grid { grid-template-columns: 1fr 1fr; }
}

/* --- warning / notice boxes --- */
.upg-warn {
  background: #fdf0ec;
  border: 1px solid #e8a13d;
  border-inline-start: 4px solid #e4574f;
  border-radius: 10px;
  padding: 10px 12px;
  margin: 10px 0;
  font-size: 14px;
  line-height: 1.5;
}
[data-theme="dark"] .upg-warn {
  background: #3a2a22;
  border-color: #8a5b2d;
}
.upg-note {
  background: #f0f7f2;
  border: 1px dashed #7fb069;
  border-radius: 10px;
  padding: 10px 12px;
  margin: 10px 0;
  font-size: 13px;
  line-height: 1.5;
}
[data-theme="dark"] .upg-note { background: #16302a; }

/* --- FAQ accordion --- */
.upg-acc {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.upg-acc-item {
  border: 1px solid var(--line, #e2ddd2);
  border-radius: 12px;
  overflow: hidden;
  background: var(--card, #fffdf7);
}

  background: #1b2b25;
  border-color: #2e4a40;
}

  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;

  border: 0;
  font: inherit;
  font-weight: 700;
  text-align: start;
  cursor: pointer;
  color: inherit;
}
.upg-acc-arrow {
  flex: 0 0 auto;
  transition: transform 0.2s;

.upg-acc-item.open .upg-acc-arrow { transform: rotate(180deg); }

/* --- legal buttons --- */
.upg-legal-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: 1fr;
  margin-top: 8px;
}
@media (min-width: 520px) {
  .upg-legal-grid { grid-template-columns: 1fr 1fr; }
}
.upg-legal-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line, #e2ddd2);
  background: var(--card, #fffdf7);
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-align: start;
  color: inherit;
}
[data-theme="dark"] .upg-legal-btn {
  background: #1b2b25;
  border-color: #2e4a40;
}
.upg-legal-btn:active { transform: scale(0.98); }
.upg-legal-body p {
  font-size: 14px;
  line-height: 1.7;
  margin: 0 0 12px;
}
.upg-legal-body .upg-template-note {
  font-size: 12px;
  opacity: 0.75;
  font-style: italic;
}

/* --- subscription extras --- */
.upg-price-note {
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-soft, #5a6b62);
  margin: 8px 0 0;
}

/* --- family league --- */
.upg-league {
  margin-top: 10px;
  border: 1px solid var(--line, #e2ddd2);
  border-radius: 12px;
  padding: 10px 12px;
  background: linear-gradient(180deg, rgba(212,175,55,0.08), transparent);
}
.upg-league-head {
  font-weight: 800;
  font-size: 15px;
  margin-bottom: 6px;
}
.upg-league-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-top: 1px dashed var(--line, #e2ddd2);
  flex-wrap: wrap;
}
.upg-league-row:first-of-type { border-top: 0; }
.upg-league-av { font-size: 26px; line-height: 1; }
.upg-league-name {
  font-weight: 700;
  font-size: 15px;
  flex: 1 1 90px;
}
.upg-league-stat {
  font-size: 13px;
  background: var(--chip, #f4efe3);
  border-radius: 999px;
  padding: 4px 10px;
  white-space: nowrap;
}
[data-theme="dark"] .upg-league-stat { background: #243b33; }

/* --- print kit (screen preview) --- */
.print-kit {
  background: #fff;
  color: #1c2a24;
  border-radius: 12px;
  padding: 16px;
  font-size: 14px;
  line-height: 1.5;
}
.print-kit h4 {
  margin: 18px 0 8px;
  font-size: 17px;
  border-bottom: 2px solid #0e3b2c;
  padding-bottom: 4px;
}
.print-kit h4:first-child { margin-top: 0; }
.pk-lines { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
.pk-line {
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.pk-line .lbl { font-weight: 700; white-space: nowrap; }
.pk-line .fill {
  flex: 1;
  border-bottom: 1px dashed #888;
  min-height: 1.4em;
}
.pk-table {
  width: 100%;
  border-collapse: collapse;
  margin: 8px 0;
  font-size: 13px;
}
.pk-table th, .pk-table td {

PIGGY.isoWeekNumber = function (date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
};

PIGGY.weeklyGamesFor = function (date) {
  const d = date instanceof Date ? date : new Date(date);
  const week = PIGGY.isoWeekNumber(d);
  const year = d.getFullYear();
  const setIndex = (week * 4) % PIGGY.GAMES.length;
  const games = [];
  for (let i = 0; i < 4; i++) games.push(PIGGY.GAMES[(setIndex + i) % PIGGY.GAMES.length]);
  // next set opens next Monday
  const next = new Date(d);
  const dow = (d.getDay() + 6) % 7; // 0 = Monday
  next.setDate(d.getDate() + (7 - dow));
  return { week, year, games, nextSetDate: next };
};

/* ---------- Subscription / two-phase model ---------- */
/*
 * שלב 1 — תקופת הדגמה: 7 ימים, ללא כרטיס אשראי, ללא חיוב.
 *   בסיום 7 הימים ההדגמה מסתיימת אוטומטית — אין מעבר אוטומטי לשום דבר.
 * שלב 2 — מנוי בתשלום: מופעל אך ורק לאחר שני תנאים מצטברים:
 *   (א) אישור מפורש של אלונה (מנהלת המערכת),
 *   (ב) חיבור המשתמש לאמצעי תשלום אמיתי והשלמת התשלום.
 * שני התנאים מתכנסים לקוד הפעלה יומי שרק אלונה יכולה להנפיק.
 * אין הוספת כרטיס אוטומטית, אין חיוב אוטומטי, אין מעבר אוטומטי,
 * אין חידוש אוטומטי. כל מעבר הוא פעולה נפרדת, מפורשת ומאושרת.
 */
PIGGY.TRIAL_MS = 7 * 24 * 3600 * 1000;
PIGGY.ADMIN_SALT = "pu-admin-2026"; // שער קל לשלב הוולידציה; סליקה אמיתית (Stripe) תגיע בהמשך

PIGGY.trialStatus = function (sub, nowTs) {
  const now = nowTs || Date.now();
  if (!sub || !sub.trialStart) return { state: "none", daysLeft: 0 };
  if (sub.plan === "premium" && sub.activatedBy === "admin-code") return { state: "premium", daysLeft: 0 };
  if (sub.plan === "requested") return { state: "requested", daysLeft: 0 };
  const elapsed = now - sub.trialStart;
  if (elapsed < PIGGY.TRIAL_MS) {
    const daysLeft = Math.ceil((PIGGY.TRIAL_MS - elapsed) / 86400000);
    return { state: "trial", daysLeft };
  }
  return { state: "expired", daysLeft: 0 };
};

PIGGY.hasGuidanceAccess = function (sub, nowTs) {
  const s = PIGGY.trialStatus(sub, nowTs);
  return s.state === "trial" || s.state === "premium";
};

PIGGY.priceForNextSubscriber = function (subsCount) {
  return subsCount < 10 ? 19 : 29;
};

PIGGY._hash32 = function (str, seed) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

function t(key) {
  const args = Array.prototype.slice.call(arguments, 1);
  const dict = I18N[LANG] || {};
  let s = dict[key];
  if (s === undefined) s = I18N.he[key];
  if (s === undefined) s = key;
  return String(s).replace(/\{(\d+)\}/g, (m, i) => args[Number(i)] !== undefined ? args[Number(i)] : m);
}

function appLocale() { return LANG === "ru" ? "ru-RU" : "he-IL"; }

/* localized content field: Hebrew in obj[field], Russian in obj[field + "_ru"] */
function loc(obj, field) {
  if (LANG === "ru" && obj[field + "_ru"] !== undefined) return obj[field + "_ru"];
  return obj[field];
}

function setLang(l) {
  LANG = l === "ru" ? "ru" : "he";
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
  document.documentElement.setAttribute("lang", LANG);
  document.documentElement.setAttribute("dir", LANG === "he" ? "rtl" : "ltr");
  document.title = t("meta.title");
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", t("meta.desc"));
  chatMsgs = [];
  chatOptions = [];
  renderApp();
}

/* ---------------- state ---------------- */
function defaultState() {
  return {
    v: 1,
    mode: "parent",
    tab: "home",
    children: [],
    activeChildId: null,
    goals: [],
    tasks: [],
    activity: [],
    sub: { trialStart: null, plan: "none", subs: 0 },
    dark: false,
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    return Object.assign(defaultState(), s);
  } catch (e) {
    return defaultState();
  }
}

let S = loadState();
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
}

   It was written for the legacy v1 build to protect v2 data, but this
   file IS the v2 build — the guard misfired on valid v2 data and
   silently blocked all writes (silent data loss). No other code
   references window.__PIGGYUP_GUARDED_V1__. */


/* ---------------- helpers ---------------- */
function uid() {
  return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function money(n) {
  const v = Number(n) || 0;
  return v.toFixed(2) + "₪";
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(appLocale(), { day: "numeric", month: "long" }) +
    ", " + d.toLocaleTimeString(appLocale(), { hour: "2-digit", minute: "2-digit" });
}
function fmtDay(ts) {
  return new Date(ts).toLocaleDateString(appLocale(), { weekday: "long", day: "numeric", month: "long" });
}
function activeChild() {
  return S.children.find((c) => c.id === S.activeChildId) || null;
}
function childGoals(childId) {
  return S.goals.filter((g) => g.childId === childId);
}
function childTasks(childId, status) {
  let t = S.tasks.filter((t) => !childId || t.childId === childId);
  if (status) t = t.filter((t) => t.status === status);
  return t.sort((a, b) => b.created - a.created);
}
function logActivity(text, childId) {
  var entry = { ts: Date.now(), text: text };
  if (childId) entry.childId = childId;
  S.activity.unshift(entry);
  S.activity = S.activity.slice(0, 40);
}
function toast(msg) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function trialInfo() {
  return PIGGY.trialStatus(S.sub, Date.now());
}
function canAccessGuidance() {
  return PIGGY.hasGuidanceAccess(S.sub, Date.now());
}

function goalCard(child) {
  const goals = childGoals(child.id);
  const g = goals[0];
  if (!g) {
    return `<div class="card">
      <div class="section-title" style="margin-top:0">${S.mode === "kids" ? t("goal.next_kids") : t("goal.next_parent")}</div>
      <p class="muted">${t("goal.none_text")}</p>
      ${S.mode === "parent" ? `<button class="btn secondary" onclick="A.go('manage')">${t("goal.goto_manage")}</button>` : ""}
    </div>`;
  }
  const pct = g.target > 0 ? Math.min(100, Math.round((g.saved / g.target) * 100)) : 0;
  return `<div class="card">
    <div class="section-title" style="margin-top:0">${S.mode === "kids" ? t("goal.next_kids") : t("goal.next_parent")}</div>
    <div class="goal-row">
      <div class="ring" style="--pct:${pct}%"><span>${pct}%</span></div>
      <div class="grow">
        <div style="font-weight:800;font-size:16px">${esc(g.title)}</div>
        <div class="muted">${t("goal.saved_of", money(g.saved), money(g.target))}</div>
        ${S.mode === "parent" ? `<button class="btn small" style="margin-top:8px" onclick="A.openDeposit('${g.id}')">${t("goal.deposit")}</button>` : ""}
      </div>
    </div>
  </div>`;
}

function parentHome() {
  const child = activeChild();
  if (!child) return noChildScreen();
  const goals = childGoals(child.id);
  const pending = childTasks(child.id, "pending");
  const total = child.money.save + child.money.invest + child.money.spend;

  const chips = S.children.length > 1
    ? `<div class="chip-row">` + S.children.map((c) =>
        `<button class="chip ${c.id === child.id ? "active" : ""}" onclick="A.selectChild('${c.id}')">${esc(c.name)}</button>`
      ).join("") + `</div>` : "";

  const pendHtml = pending.length === 0
    ? `<div class="empty">${t("home.no_pending")}</div>`
    : pending.map((task) => `
      <div class="row-item">
        <div class="icon-badge">⏳</div>
        <div class="grow"><div style="font-weight:700">${esc(task.title)}</div>
        <div class="sub">${esc(child.name)} · ${t("common.points", task.points)}</div></div>
        <button class="btn small" onclick="A.approveTask('${task.id}')">${t("common.approve")}</button>
      </div>`).join("");

  const actHtml = S.activity.length === 0
    ? `<div class="empty">${t("home.no_activity")}</div>`
    : S.activity.slice(0, 8).map((a) => `
      <div class="row-item">
        <div class="icon-badge">🧾</div>
        <div class="grow"><div style="font-size:14px">${esc(a.text)}</div>
        <div class="sub">${fmtDate(a.ts)}</div></div>
      </div>`).join("");

  return `<div class="screen">
    ${chips}
    <div class="card dark balance-card">
      <div class="balance-top">
        <div><div class="balance-label">${t("home.balance_of", esc(child.name))}</div>
        <div class="balance-amount">${money(total)}</div></div>
        <button class="add-btn" onclick="A.openAddMoney('${child.id}')" aria-label="${t("home.add_money_aria")}">+</button>
      </div>
      ${moneyCols(child.money)}
    </div>
    ${goalCard(child)}
    <div class="section-title">${t("home.pending_title")}</div>
    <div class="card" style="margin-top:6px">${pendHtml}</div>
    <div class="section-title">${t("home.recent_title")}</div>
    <div class="card" style="margin-top:6px">${actHtml}</div>
  </div>`;
}

}
function pushBot(text) { chatMsgs.push({ from: "bot", text: chatFill(text) }); }
function pushUser(text) { chatMsgs.push({ from: "user", text }); }
function showTopics() {
  chatOptions = PIGGY.CHAT_TOPICS.map((topic) => ({ label: loc(topic, "label"), next: topic.id + "_1" }));
}
function chatGo(nodeId) {
  const node = PIGGY.CHAT_NODES[nodeId];
  if (!node) return;
  if (nodeId === "games_hint") {
    pushBot(t("chat.games_hint"));
    chatOptions = [{ label: t("chat.back_topics"), next: "__topics" }];
    renderChat();
    return;
  }
  pushBot(loc(node, "text"));
  if (node.options === "topics") showTopics();
  else chatOptions = node.options.map((o) => ({ label: loc(o, "label"), next: o.next }));
  renderChat();
}
function renderChat() {
  const box = document.getElementById("chatBox");
  if (!box) return;
  box.innerHTML = chatMsgs.map((m) =>
    `<div class="msg ${m.from}">${esc(m.text)}</div>`).join("");
  box.scrollTop = box.scrollHeight;
  const chips = document.getElementById("chatChips");
  if (chips) {
    chips.innerHTML = chatOptions.map((o, i) =>
      `<button class="chip" onclick="A.chatChoose(${i})">${esc(o.label)}</button>`).join("");
  }
}

/* ---------------- actions ---------------- */
const A = {
  go(tab) { S.tab = tab; save(); renderApp(); window.scrollTo(0, 0); },
  openSubscription() { S.mode = "parent"; S.tab = "manage"; save(); renderApp(); window.scrollTo(0, 0); },
  setMode(mode) {
    S.mode = mode;
    const tabs = mode === "parent" ? PARENT_TABS : KIDS_TABS;
    if (!tabs.find((t) => t.id === S.tab)) S.tab = "home";
    save(); renderApp(); window.scrollTo(0, 0);
  },
  selectChild(id) { S.activeChildId = id; save(); renderApp(); },
  closeModal,
  setLang,

  createChild() {
    const inp = document.getElementById("ncName");
    const name = (inp.value || "").trim();
    if (!name) { toast(t("toast.child_name")); return; }
    const c = { id: uid(), name, points: 0, money: { save: 0, invest: 0, spend: 0 } };
    S.children.push(c);
    if (!S.activeChildId) S.activeChildId = c.id;
    logActivity(t("log.child_created", name));
    save(); renderApp();
    toast(t("toast.welcome", name));
  },

  openAddMoney: addMoneyModal,
  doAddMoney(childId) {
    const c = S.children.find((x) => x.id === childId);
    const s = Math.max(0, Number(document.getElementById("amSave").value) || 0);
    const i = Math.max(0, Number(document.getElementById("amInvest").value) || 0);
    const p = Math.max(0, Number(document.getElementById("amSpend").value) || 0);
    if (s + i + p <= 0) { toast(t("toast.amount")); return; }
    c.money.save += s; c.money.invest += i; c.money.spend += p;
    logActivity(t("log.money_added", money(s + i + p), c.name));
    save(); closeModal(); renderApp();
    toast(t("toast.money_added"));
  },

  openGoal: goalModal,
  doCreateGoal(childId) {
    const title = (document.getElementById("ngTitle").value || "").trim();
    const target = Math.max(1, Number(document.getElementById("ngTarget").value) || 0);
    if (!title) { toast(t("toast.goal_name")); return; }
    S.goals.push({ id: uid(), childId, title, target, saved: 0 });
    logActivity(t("log.goal_created", title, money(target)));
    save(); closeModal(); renderApp();
    toast(t("toast.goal_created"));
  },
  openDeposit: depositModal,
  doDeposit(goalId) {
    const g = S.goals.find((x) => x.id === goalId);
    const c = S.children.find((x) => x.id === g.childId);
    const amt = Math.max(0, Number(document.getElementById("depAmt").value) || 0);
    if (amt <= 0 || amt > c.money.save) { toast(t("toast.bad_amount")); return; }
    c.money.save -= amt; g.saved += amt;
    logActivity(t("log.deposited", money(amt), g.title));
    save(); closeModal(); renderApp();
    toast(t("toast.deposited"));
  },

  createTask() {
    const childId = document.getElementById("ntChild").value;
    const title = (document.getElementById("ntTitle").value || "").trim();
    const points = Math.max(1, Number(document.getElementById("ntPoints").value) || 10);
    if (!title) { toast(t("toast.task_desc")); return; }
    S.tasks.push({ id: uid(), childId, title, points, status: "open", created: Date.now() });
    save(); renderApp();
    toast(t("toast.task_added"));
  },
  completeTask(id) {
    const tsk = S.tasks.find((x) => x.id === id);
    tsk.status = "pending";
    save(); renderApp();
    toast(t("toast.task_done"));
  },
  approveTask(id) {
    const tsk = S.tasks.find((x) => x.id === id);
    const c = S.children.find((x) => x.id === tsk.childId);
    tsk.status = "approved";
    c.points += tsk.points;
    logActivity(t("log.task_approved", c.name, tsk.title, tsk.points));
    save(); renderApp();
    toast(t("toast.approved", tsk.points, c.name));
  },

  startTrial() {
    const ti = trialInfo();
    if (ti.state !== "none") return; // ניתן להתחיל הדגמה פעם אחת בלבד
    S.sub.trialStart = Date.now();
    S.sub.plan = "trial";
    if (window.__piggyPing) window.__piggyPing("trial_started");
    save(); renderApp();
    toast(t("toast.trial_started"));
  },
  // שלב 2: המשתמש רק *מבקש* מנוי בתשלום — אין הפעלה אוטומטית, אין חיוב.
  // הלחיצה פותחת וואטסאפ עם הודעה מוכנה לאלונה; ההפעלה מתבצעת רק עם קוד
  // מאלונה (לאחר אישורה והשלמת תשלום אמיתי).
  openWhatsAppRequest() {
    var nameEl = document.getElementById("reqName");
    var phoneEl = document.getElementById("reqPhone");
    var name = nameEl ? nameEl.value.trim() : "";
    var phone = phoneEl ? phoneEl.value.trim() : "";
    var msg = t("wa.msg");
    if (name) msg += "\n" + t("wa.name_line", name);
    if (phone) msg += "\n" + t("wa.phone_line", phone);
    window.open("https://wa.me/972506575168?text=" + encodeURIComponent(msg), "_blank");
  },
  requestSubscription(resend) {
    const ti = trialInfo();
    if (!resend) {
      if (ti.state !== "expired") return; // בקשה אפשרית רק אחרי סיום ההדגמה
      S.sub.plan = "requested";
      S.sub.requestedAt = Date.now();
      save(); renderApp();
    }
    A.openWhatsAppRequest();
    toast(t("toast.wa_opened"));
  },
  activateWithCode() {
    const input = document.getElementById("admin-code-input");
    const code = input ? input.value.trim() : "";
    if (!PIGGY.verifyAdminCode(code)) {
      toast(t("toast.bad_code"));
      return;
    }
    S.sub.plan = "premium";
    S.sub.activatedBy = "admin-code";
    S.sub.activatedAt = Date.now();
    S.sub.subs += 1;
    save(); renderApp();
    toast(t("toast.sub_activated"));
  },
  toggleDark() {
    S.dark = !S.dark;
    document.documentElement.setAttribute("data-theme", S.dark ? "dark" : "light");
    save();
  },
  resetAll() {
    if (!confirm(t("confirm.reset"))) return;
    localStorage.removeItem(LS_KEY);
    S = defaultState();
    chatMsgs = [];
    renderApp();
  },

  /* chat */

<script>
/* ===== chunk js: 10-money ===== */
/* ============================================================
   PiggyUp MONEY CORE v2 (10-money)
   Parent home · add money (smart/manual split) · split rules ·
   boxes customization · ledger history · investment matching.
   All amounts are integers in agorot (fmtAg for display).
   Overrides: parentHome, addMoneyModal (rebound on A too).
   ============================================================ */
"use strict";

/* ---------------- money helpers ---------------- */
function upgBoxById(id) {
  var boxes = S.boxes || [];
  for (var i = 0; i < boxes.length; i++) if (boxes[i].id === id) return boxes[i];
  return { id: id, icon: "🐷", color: "#7fb069", customName: null, archived: false };
}
function upgActiveBoxes() {
  return (S.boxes || []).filter(function (b) { return !b.archived; });
}
function upgBoxName(box) {
  if (box.customName && String(box.customName).trim()) return String(box.customName).trim();
  return t("upg.m.box_" + box.id);
}
/* Parse a ₪ input into agorot. Returns null when invalid (NaN / negative). */
function upgParseAg(elId) {
  var el = document.getElementById(elId);
  if (!el) return null;
  var raw = String(el.value == null ? "" : el.value).replace(",", ".").trim();
  if (raw === "") return null;
  var n = Number(raw);
  if (!isFinite(n) || n < 0) return null;
  return Math.round(n * 100);
}
function upgChildTotal(child) {
  var m = (child && child.money) || {};
  return (m.save || 0) + (m.invest || 0) + (m.spend || 0);
}
/* Smart split: integer agorot, shares always sum EXACTLY to totalAg.
   Rule percentages are normalized across the given (active) boxes. */
function upgSmartSplit(totalAg, boxes) {
  var r = S.splitRule || { save: 30, invest: 20, spend: 50 };
  var tot = 0, i;
  for (i = 0; i < boxes.length; i++) tot += (Number(r[boxes[i].id]) || 0);
  var parts = boxes.map(function (b) {
    var raw = tot > 0 ? totalAg * (Number(r[b.id]) || 0) / tot : 0;
    return { id: b.id, box: b, raw: raw, ag: Math.floor(raw) };
  });
  var rest = totalAg - parts.reduce(function (s, p) { return s + p.ag; }, 0);
  parts.sort(function (a, b) { return (b.raw - b.ag) - (a.raw - a.ag); });
  for (i = 0; i < rest; i++) parts[i % parts.length].ag += 1;
  var order = {};
  boxes.forEach(function (b, idx) { order[b.id] = idx; });
  parts.sort(function (a, b) { return order[a.id] - order[b.id]; });
  return parts;
}
function upgSrcLabel(src) {
  if (!src) return "";
  var s = t("upg.m.src_" + src);
  if (s.indexOf("upg.m.") === 0) return src; /* unknown source: show raw */
  return s;
}
function upgBoxHasHistory(boxId) {
  return (S.ledger || []).some(function (x) { return x.boxId === boxId; });
}
function upgTypeTag(type) {
  if (type === "correction") return t("upg.m.ledger_type_correction");
  if (type === "match") return t("upg.m.ledger_type_match");
  return "";
}

/* ---------------- modal-internal handlers ---------------- */
var UpgMoney = {
  SOURCES: ["allowance", "gift", "chores", "sale", "found", "other"],
  ICONS: ["💰", "📈", "🎁", "🐷", "⭐", "🎮", "🚲", "📚"],
  COLORS: ["#7fb069", "#4caf7d", "#e8a13d", "#e4574f", "#5aa9e6", "#9b7fb0"],
  confirmTxId: null,
  boxDraft: null,

  setMode: function (mode, childId) {
    var h = document.getElementById("amMode");
    if (h) h.value = mode;
    var seg = document.querySelectorAll(".upg-seg button");
    for (var i = 0; i < seg.length; i++) {
      seg[i].classList.toggle("on", seg[i].getAttribute("data-mode") === mode);
    }
    var rows = document.getElementById("amManualRows");
    if (rows) rows.style.display = mode === "manual" ? "" : "none";
    var hint = document.getElementById("amSmartHint");
    if (hint) hint.style.display = mode === "smart" ? "" : "none";
    this.preview(childId);
  },
  quickAmt: function (q, childId) {
    var el = document.getElementById("amAmount");
    if (el) el.value = q;
    this.preview(childId);
  },
  preview: function (childId) {
    var prevEl = document.getElementById("amPreview");
    if (!prevEl) return;
    var modeEl = document.getElementById("amMode");
    var mode = (modeEl && modeEl.value) || "smart";
    var amountAg = upgParseAg("amAmount");
    var boxes = upgActiveBoxes();
    if (amountAg == null || amountAg <= 0 || !boxes.length) {
      prevEl.innerHTML = '<div class="upg-muted">' + t("upg.m.am_preview_hint") + "</div>";
      return;
    }
    var parts, ok = true, sum = amountAg;
    if (mode === "smart") {
      parts = upgSmartSplit(amountAg, boxes);
    } else {
      parts = boxes.map(function (b) {
        return { id: b.id, box: b, ag: upgParseAg("amBox_" + b.id) || 0 };
      });
      sum = parts.reduce(function (s, p) { return s + p.ag; }, 0);
      ok = (sum === amountAg);
    }
    var rows = parts.map(function (p) {
      return '<div class="pr-row"><span>' + esc(p.box.icon || "🐷") + " " +
        esc(upgBoxName(p.box)) + '</span><span><b>' + fmtAg(p.ag) + "</b></span></div>";
    }).join("");
    var sumLine = mode === "manual"
      ? '<div class="pr-row pr-total"><span>' + t("upg.m.am_preview") + '</span><span class="' +
        (ok ? "pr-ok" : "pr-bad") + '">' + fmtAg(sum) + (ok ? " ✓" : " ✗") + "</span></div>"
      : '<div class="pr-row pr-total"><span>' + t("upg.m.am_preview") + '</span><span><b>' +
        fmtAg(amountAg) + "</b></span></div>";
    prevEl.innerHTML = '<div class="pr-head">' + t("upg.m.am_preview") + "</div>" + rows + sumLine;
  },

  /* ---- split rules editor ---- */
  splitPreview: function () {
    var sEl = document.getElementById("sp_save");
    var iEl = document.getElementById("sp_invest");
    var pEl = document.getElementById("sp_spend");
    if (!sEl || !iEl || !pEl) return; /* modal not in DOM (e.g. unit test) */
    ["save", "invest", "spend"].forEach(function (id) {
      var el = document.getElementById("sp_" + id);
      if (el && el.value !== "") {
        var n = Math.round(Number(String(el.value).replace(",", ".")));
        if (isFinite(n)) el.value = Math.max(0, Math.min(100, n));
      }
    });
    var s = Number(sEl.value) || 0;
    var iv = Number(iEl.value) || 0;
    var sp = Number(pEl.value) || 0;
    var sum = Math.round(s) + Math.round(iv) + Math.round(sp);
    var sumEl = document.getElementById("spSum");
    var errEl = document.getElementById("spErr");
    if (sumEl) sumEl.innerHTML = "<b>" + t("upg.m.split_sum", sum) + "</b>";
    if (errEl) errEl.style.display = sum === 100 ? "none" : "";
    /* Blocked state: the save button looks disabled until the total is
     * exactly 100% — no "click then error" anymore. */
    var saveBtn = document.getElementById("spSave");
    if (saveBtn) saveBtn.disabled = sum !== 100;
  },

  /* ---- boxes editor (draft, applied on save) ---- */
  boxDraftName: function (id, v) {
    if (!this.boxDraft) return;
    var b = this.boxDraft.filter(function (x) { return x.id === id; })[0];
    if (b) b.customName = v;

  boxPick: function (id, field, val, el) {
    if (!this.boxDraft) return;
    var b = this.boxDraft.filter(function (x) { return x.id === id; })[0];
    if (!b) return;
    b[field] = val;
    var sibs = el.parentNode.querySelectorAll("button");
    for (var i = 0; i < sibs.length; i++) sibs[i].classList.remove("on");
    el.classList.add("on");
    var prev = document.getElementById("bxPrev_" + id);
    if (prev) {
      if (field === "icon") prev.textContent = val;
      if (field === "color") prev.style.background = val;
    }
  },
  boxToggleArchive: function (id, childId) {
    if (!this.boxDraft) return;

/* ---------------- A: money actions ---------------- */
Object.assign(A, {
  openAddMoney: addMoneyModal,
  openSpendMoney: spendMoneyModal,

  doAddMoney: function (childId) {
    var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
    if (!c) return;
    var opIdEl = document.getElementById("amOpId");
    var opId = opIdEl ? opIdEl.value : uid();
    var mode = (document.getElementById("amMode") || {}).value || "smart";
    var amountAg = upgParseAg("amAmount");
    var boxes = upgActiveBoxes();
    if (amountAg == null || amountAg <= 0 || !boxes.length) {
      toast(t(boxes.length ? "upg.m.am_bad" : "upg.m.am_no_boxes"));
      return;
    }
    var parts;
    if (mode === "smart") {
      parts = upgSmartSplit(amountAg, boxes);
    } else {
      parts = boxes.map(function (b) {
        return { id: b.id, ag: upgParseAg("amBox_" + b.id) || 0 };
      });
      var sum = parts.reduce(function (s, p) { return s + p.ag; }, 0);
      if (sum !== amountAg) { toast(t("upg.m.am_sum_bad")); return; }
    }
    parts = parts.filter(function (p) { return p.ag > 0; });
    if (!parts.length) { toast(t("upg.m.am_bad")); return; }
    var srcEl = document.getElementById("amSource");
    var source = srcEl ? srcEl.value : "other";
    var noteEl = document.getElementById("amNote");
    var note = noteEl ? String(noteEl.value || "").trim().slice(0, 120) : "";

    /* Double-click protection: disable submit immediately; onceOp on the
     * per-modal opId guarantees the money is applied exactly once. */
    var confirmBtn = document.getElementById("amConfirm");
    if (confirmBtn) { confirmBtn.disabled = true; }

    var applied = onceOp("addmoney-" + opId, function () {
      parts.forEach(function (p) {
        addTx({
          childId: childId, boxId: p.id, amountAg: p.ag,
          type: "income", source: source, note: note, by: "parent"
        });
      });
      /* ledger is the source of truth; balances are a cache */
      rebuildBalances(c);
      logActivity(t("upg.m.log_money_added", fmtAg(amountAg), c.name));
      return true;
    });
    save();
    A.closeModal();
    renderApp();
    if (applied) toast(t("upg.m.am_added", fmtAg(amountAg), c.name));
  },

  doSpendMoney: function (childId) {
    var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
    if (!c) return;
    if (typeof Roles !== "undefined" && Roles.requireParent && !Roles.requireParent()) return;
    var opIdEl = document.getElementById("spOpId");
    var opId = opIdEl ? opIdEl.value : uid();
    var amountAg = upgParseAg("spAmount");
    if (amountAg == null || amountAg <= 0) { toast(t("upg.m.sp_bad")); return; }
    /* ledger is the source of truth; never let the spend go below zero */
    rebuildBalances(c);
    var availAg = ((c.money || {})["spend"] || 0);
    if (amountAg > availAg) { toast(t("upg.m.sp_over")); return; }
    var noteEl = document.getElementById("spNote");
    var note = noteEl ? String(noteEl.value || "").trim().slice(0, 120) : "";

    /* Double-click protection: disable submit immediately; onceOp on the
     * per-modal opId guarantees the money is applied exactly once. */
    var confirmBtn = document.getElementById("spConfirm");
    if (confirmBtn) { confirmBtn.disabled = true; }

    var applied = onceOp("spendmoney-" + opId, function () {
      addTx({
        childId: childId, boxId: "spend", amountAg: -amountAg,
        type: "expense", source: "", note: note, by: "parent"
      });
      rebuildBalances(c);
      logActivity(t("upg.m.log_spent", fmtAg(amountAg), c.name));
      return true;
    });
    save();
    A.closeModal();
    renderApp();
    if (applied) toast(t("upg.m.sp_added", fmtAg(amountAg)));
  },

  /* ---- split rules editor ---- */
  openSplitModal: function () {
    var r = S.splitRule || { save: 30, invest: 20, spend: 50 };
    var ids = ["save", "invest", "spend"];
    openModal(
      "<h3>" + t("upg.m.split_title") + "</h3>" +
      '<p class="muted">' + t("upg.m.split_hint") + "</p>" +
      ids.map(function (id) {
        var b = upgBoxById(id);
        return '<div class="field"><label>' + esc(b.icon || "🐷") + " " + esc(upgBoxName(b)) +
          " (%)</label>" +
          '<input id="sp_' + id + '" type="number" min="0" max="100" step="1" value="' +
          (Number(r[id]) || 0) + '" inputmode="numeric" oninput="UpgMoney.splitPreview()"></div>';
      }).join("") +
      '<div id="spSum" class="upg-muted" style="margin:6px 0"></div>' +
      '<div id="spErr" class="upg-err" style="display:none">' + t("upg.m.split_err") + "</div>" +
      '<p class="muted">' + t("upg.m.split_note") + "</p>" +
      '<button class="btn" id="spSave" onclick="A.doSaveSplit()">' + t("upg.m.common_save") + "</button>" +
      '<button class="btn secondary" onclick="A.closeModal()">' + t("upg.m.common_cancel") + "</button>"
    );
    UpgMoney.splitPreview();
  },
  doSaveSplit: function () {
    function pct(id) {
      var el = document.getElementById("sp_" + id);
      if (!el) return null;
      var raw = String(el.value == null ? "" : el.value).replace(",", ".").trim();
      if (raw === "") return null;
      var n = Number(raw);
      if (!isFinite(n) || n < 0 || n > 100) return null;
      return Math.round(n);
    }
    var s = pct("save"), iv = pct("invest"), sp = pct("spend");
    var errEl = document.getElementById("spErr");
    if (s == null || iv == null || sp == null || s + iv + sp !== 100) {
      if (errEl) errEl.style.display = "";
      UpgMoney.splitPreview();
      return;
    }
    S.splitRule = { save: s, invest: iv, spend: sp };
    save();
    A.closeModal();
    renderApp();
    toast(t("upg.m.split_saved"));
  },

  /* ---- boxes customization ---- */
  openBoxesModal: function (childId) {
    UpgMoney.boxDraft = null;
    UpgMoney.renderBoxesModal(childId);
  },
  doSaveBoxes: function () {
    var draft = UpgMoney.boxDraft || [];
    (S.boxes || []).forEach(function (b) {
      var d = draft.filter(function (x) { return x.id === b.id; })[0];
      if (!d) return;
      b.customName = (d.customName && String(d.customName).trim()) ? String(d.customName).trim() : null;
      b.icon = d.icon || b.icon;
      b.color = d.color || b.color;
      b.archived = !!d.archived;
    });
    UpgMoney.boxDraft = null;
    save();
    A.closeModal();
    renderApp();
    toast(t("upg.m.boxes_saved"));
  },

  /* ---- ledger history ---- */
  openLedgerModal: function (childId) {
    var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
    if (!c) return;
    var txs = txForChild(childId).slice().sort(function (a, b) { return b.ts - a.ts; });
    var rows = txs.length ? txs.map(function (tx) {
      var b = upgBoxById(tx.boxId);
      var pos = tx.amountAg >= 0;
      var tag = upgTypeTag(tx.type);
      var sub = [];
      var sl = upgSrcLabel(tx.source);
      if (sl) sub.push(esc(sl));
      if (tx.note) sub.push(esc(tx.note));
      var action;
      if (UpgMoney.confirmTxId === tx.id) {
        action = '<div class="upg-confirm-box">' + t("upg.m.ledger_confirm_q") +
          '<div class="upg-row-btns">' +
          '<button class="btn warn small" style="flex:1" onclick="A.doCorrectTx(\'' + tx.id + "','" +
          childId + "')\">" + t("upg.m.ledger_yes") + "</button>" +
          '<button class="btn secondary small" style="flex:1" onclick="A.askCorrectTx(null,\'' +
          childId + "')\">" + t("upg.m.ledger_no") + "</button></div></div>";
      } else if (tx.type !== "correction") {
        action = '<button class="upg-corr-btn" onclick="A.askCorrectTx(\'' + tx.id + "','" +
          childId + "')\">" + t("upg.m.ledger_correct") + "</button>";
      } else {
        action = "";
      }
      return '<div><div class="upg-ledger-row">' +
        '<span class="upg-ledger-ico">' + esc(b.icon || "🧾") + "</span>" +
        '<div class="upg-ledger-main">' +
        '<span class="upg-ledger-amt ' + (pos ? "pos" : "neg") + '">' + (pos ? "+" : "") +
        fmtAg(tx.amountAg) + "</span>" +
        (tag ? '<span class="upg-tag">' + tag + "</span>" : "") +
        (sub.length ? '<div class="upg-ledger-sub">' + sub.join(" · ") + "</div>" : "") +
        "</div>" +
        '<span class="upg-ledger-date">' + fmtDate(tx.ts) + "</span></div>" +
        action + "</div>";
    }).join("") : '<div class="empty">' + t("upg.m.ledger_empty") + "</div>";
    openModal(
      "<h3>" + t("upg.m.ledger_title", esc(c.name)) + "</h3>" +
      '<div style="max-height:56vh;overflow-y:auto">' + rows + "</div>" +
      '<button class="btn secondary" onclick="A.closeModal()">' + t("upg.m.common_close") + "</button>"
    );
  },
  askCorrectTx: function (txId, childId) {
    UpgMoney.confirmTxId = txId || null;
    A.openLedgerModal(childId);
  },
  doCorrectTx: function (txId, childId) {
    var tx = (S.ledger || []).filter(function (x) { return x.id === txId; })[0];
    if (!tx || tx.type === "correction") return;
    var child = (S.children || []).filter(function (x) { return x.id === tx.childId; })[0];
    onceOp("correct-" + tx.id, function () {
      addTx({
        childId: tx.childId, boxId: tx.boxId, amountAg: -tx.amountAg,
        type: "correction", source: tx.source,
        note: t("upg.m.ledger_corr_note", fmtDate(tx.ts)) + " · #" + tx.id,
        by: "parent"
      });
      if (child) rebuildBalances(child);
      logActivity(t("upg.m.ledger_corrected"));
      return true;
    });
    UpgMoney.confirmTxId = null;
    save();
    A.openLedgerModal(childId || tx.childId);
    renderApp();
  },

  /* ---- investment matching rule ---- */
  openInvestRuleModal: function () {
    var rule = S.investRule || null;
    var cur = rule ? rule.type : "off";
    function radio(v, label, checked) {
      return '<label class="upg-radio-row"><input type="radio" name="invType" value="' + v + '"' +
        (checked ? " checked" : "") + ' onchange="UpgMoney.invTypeChanged()"><span>' + label + "</span></label>";
    }
    var summary = "";
    if (rule && rule.type === "per10") {
      summary = '<div class="upg-ok">✅ ' + t("upg.m.inv_per10") + ": <b>" + fmtAg(rule.amountAg) +
        "</b></div>";
    } else if (rule && rule.type === "monthlyPct") {
      summary = '<div class="upg-ok">✅ ' + t("upg.m.inv_monthly") + ": <b>" + rule.pct + "%</b></div>";
    }
    openModal(
      "<h3>" + t("upg.m.inv_title") + "</h3>" +
      '<p class="muted">' + t("upg.m.inv_desc") + "</p>" +
      summary +
      radio("off", t("upg.m.inv_off"), cur === "off") +
      radio("per10", t("upg.m.inv_per10"), cur === "per10") +
      '<div class="field" id="invPer10Wrap" style="display:' + (cur === "per10" ? "" : "none") + '">' +
      "<label>" + t("upg.m.inv_per10_amt") + "</label>" +
      '<input id="invPer10Amt" type="number" min="0" step="0.5" inputmode="decimal" value="' +
      (rule && rule.type === "per10" ? (rule.amountAg / 100) : "") + '"></div>' +
      radio("monthlyPct", t("upg.m.inv_monthly"), cur === "monthlyPct") +
      '<div class="field" id="invMonthlyWrap" style="display:' + (cur === "monthlyPct" ? "" : "none") + '">' +
      "<label>" + t("upg.m.inv_monthly_pct") + "</label>" +
      '<input id="invMonthlyPct" type="number" min="1" max="100" step="1" inputmode="numeric" value="' +
      (rule && rule.type === "monthlyPct" ? rule.pct : "") + '"></div>' +
      '<div class="upg-disclaimer">' + t("upg.m.inv_disclaimer") + "</div>" +
      '<button class="btn" onclick="A.doSaveInvestRule()">' + t("upg.m.inv_save") + "</button>" +
      (rule
        ? '<button class="btn secondary" onclick="A.applyInvestMatch()">📈 ' +
          t("upg.m.inv_apply") + "</button>"
        : "") +
      '<button class="btn secondary" onclick="A.closeModal()">' + t("upg.m.common_cancel") + "</button>"
    );
    UpgMoney.invTypeChanged();
  },
  doSaveInvestRule: function () {
    var checked = document.querySelector('input[name="invType"]:checked');
    var v = checked ? checked.value : "off";
    var rule = null;
    if (v === "per10") {
      var ag = upgParseAg("invPer10Amt");
      if (ag == null || ag <= 0) { toast(t("upg.m.inv_bad")); return; }
      rule = { type: "per10", amountAg: ag };
    } else if (v === "monthlyPct") {
      var el = document.getElementById("invMonthlyPct");
      var p = el ? Number(String(el.value == null ? "" : el.value).replace(",", ".")) : NaN;
      if (!isFinite(p) || p <= 0 || p > 100) { toast(t("upg.m.inv_bad")); return; }
      rule = { type: "monthlyPct", pct: Math.round(p) };
    }
    S.investRule = rule;
    save();
    A.closeModal();
    renderApp();
    toast(t("upg.m.inv_saved"));
  },
  applyInvestMatch: function () {
    var rule = S.investRule;
    if (!rule) { toast(t("upg.m.inv_bad")); return; }
    var now = new Date();
    var mk = now.getFullYear() + "-" + (now.getMonth() + 1);
    var monthLabel = (now.getMonth() + 1) + "/" + now.getFullYear();
    var jobs = [];
    (S.children || []).forEach(function (c) {
      var inc = txForChild(c.id).reduce(function (s, x) {
        if (x.type !== "income" || x.boxId !== "invest" || !(x.amountAg > 0)) return s;
        var d = new Date(x.ts);
        if (d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth()) return s;
        return s + x.amountAg;
      }, 0);
      var matchAg = 0;
      if (rule.type === "per10") matchAg = Math.floor(inc / 1000) * rule.amountAg;
      else if (rule.type === "monthlyPct") matchAg = Math.round(inc * rule.pct / 100);
      if (matchAg > 0) jobs.push({ child: c, matchAg: matchAg });
    });
    if (!jobs.length) { toast(t("upg.m.inv_nothing")); return; }
    var total = jobs.reduce(function (s, j) { return s + j.matchAg; }, 0);
    var applied = onceOp("match-" + mk, function () {
      jobs.forEach(function (j) {
        addTx({
          childId: j.child.id, boxId: "invest", amountAg: j.matchAg,
          type: "match", source: "invest_match",
          note: t("upg.m.inv_match_note", monthLabel), by: "parent"
        });
        rebuildBalances(j.child);
      });
      logActivity(t("upg.m.inv_applied", fmtAg(total)));
      return true;
    });
    save();
    A.closeModal();
    renderApp();
    toast(applied ? t("upg.m.inv_applied", fmtAg(total)) : t("upg.m.inv_already"));
  }
});

</script>

<script>
/* ===== chunk js: 20-missions ===== */
/* ============================================================
   PiggyUp UPGRADE 20 — GOALS + TASKS + AI MISSIONS (structured)
   Overrides: goalModal, depositModal, goalCard, parentTasks,
             kidsTasks, kidsHome (+ A.* extensions).
   Parent-approved daily missions: NO open chat, curated bank only.
   Money: agorot integers everywhere. Awards via onceOp.
   ============================================================ */
"use strict";

/* ---------------- private helpers (upg* namespace) ---------------- */
function upgLoc(o) { return (typeof LANG !== "undefined" && LANG === "ru") ? o.ru : o.he; }
function upgDayStr(ts) {
  var d = new Date(ts);
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function upgDayIndex() {
  var start = (S.sub && S.sub.trialStart) ? S.sub.trialStart : 0;
  return Math.floor((Date.now() - start) / 86400000);
}
function upgGoalPct(g) {
  if (!g || !(g.target > 0)) return 0;
  return Math.min(100, Math.round((g.saved / g.target) * 100));
}
/* CSS-only confetti (core CSS provides .upg-confetti; reduced-motion neuters it) */
function upgConfetti() {
  try {
    var d = document.createElement("div");
    d.className = "upg-confetti";
    var colors = ["#f6c453", "#7fb069", "#4caf7d", "#e8a13d", "#e4574f", "#ffffff", "#ffd166"];
    for (var i = 0; i < 24; i++) {
      var s = document.createElement("i");
      s.style.left = (Math.random() * 100) + "%";
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (Math.random() * 0.6) + "s";
      d.appendChild(s);
    }
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 3000);
  } catch (e) {}
}

var UPG_GOAL_ICONS = ["🎯", "🚲", "🎮", "📚", "⚽", "✈️", "🎸", "🧸", "💻", "🐶", "🎨", "🏖️"];
var UPG_ACH = {
  first_task:   { icon: "🌟", key: "upg.b.ach_first_task" },
  streak_7:     { icon: "🔥", key: "upg.b.ach_streak_7" },
  goal_crusher: { icon: "🎯", key: "upg.b.ach_goal_crusher" },
  mission_10:   { icon: "🏆", key: "upg.b.ach_mission_10" }
};

/* Streak: consecutive active days only move forward. Never decrements,
   never shows a "failed" state — purely positive. */
function upgBumpStreak(child) {
  if (!child) return;
  var today = upgDayStr(Date.now());
  if (child.lastActiveDay === today) return;
  var yesterday = upgDayStr(Date.now() - 86400000);
  child.streak = (child.lastActiveDay === yesterday) ? ((child.streak || 0) + 1) : 1;
  child.lastActiveDay = today;
  if (child.streak >= 7) upgAwardAch(child, "streak_7");
}
/* Achievements: awarded once, toast + confetti on new. Positive only. */
function upgAwardAch(child, id) {
  if (!child) return false;
  child.achievements = child.achievements || [];
  for (var i = 0; i < child.achievements.length; i++) {
    if (child.achievements[i].id === id) return false;
  }
  child.achievements.push({ id: id, ts: Date.now() });
  var m = UPG_ACH[id];
  upgConfetti();
  toast(t("upg.b.ach_new", m ? t(m.key) : id));
  return true;
}
/* Shared award path for task approval: points + optional money reward. */
function upgAwardTask(tsk, c) {
  var pts = Math.round(Number(tsk.points) || 0);
  var mAg = Math.round(Number(tsk.moneyAg) || 0);
  tsk.status = "approved";
  tsk.approvedAt = Date.now();
  tsk.rejectReason = null;
  if (c) {
    c.points += pts;
    if (mAg > 0) {
      c.money.spend += mAg;
      addTx({ childId: c.id, boxId: "spend", amountAg: mAg, type: "income",
              source: "task", note: tsk.title, by: "parent" });
    }
    upgBumpStreak(c);
    upgAwardAch(c, "first_task");
  }
  if (tsk.recurring && tsk.recurring !== "once") upgSpawnNext(tsk);
  return { pts: pts, mAg: mAg };
}
/* Recurring tasks: spawn the next instance when the current one is approved. */
function upgSpawnNext(tsk) {
  var days = tsk.recurring === "daily" ? 1 : 7;
  var base = tsk.dueTs || Date.now();
  S.tasks.push({
    id: uid(), childId: tsk.childId, title: tsk.title, desc: tsk.desc || "",
    points: tsk.points, moneyAg: tsk.moneyAg || 0, status: "open",
    recurring: tsk.recurring, requiresApproval: tsk.requiresApproval !== false,
    dueTs: base + days * 86400000, rejectReason: null, created: Date.now()
  });
}
