/* ============================================================
   DAILY MISSION CARD (parent dashboard slot).
   Child B (money module) calls UpgMissionCard() from parentHome.
   Returns "" when there is nothing to show.
   ============================================================ */
window.UpgMissionCard = function () {
  try {
    if (typeof AIService === "undefined" || !AIService.bank || !AIService.bank.length) return "";
    var child = activeChild();
    if (!child) return "";
    var bank = AIService.bank;
    var done = S.missionsDone || [];
    var allDone = bank.every(function (x) { return done.indexOf(x.id) !== -1; });
    if (allDone) return "";
    var m = AIService.pickFor(upgDayIndex());
    if (!m || done.indexOf(m.id) !== -1) return "";
    var c = upgLoc(m);
    return `<div class="card upg-mission">
      <div class="upg-mission-top">
        <span class="upg-badge">${t("upg.b.mission_today")}</span>
        <span class="upg-mission-day">${t("upg.b.mission_day", m.day)}</span>
        <span class="upg-mission-day">${t("upg.b.mission_minutes", m.minutes)}</span>
        <span class="upg-mission-day">${t("common.points_plus", m.coins)}</span>
      </div>
      <div class="upg-mission-title">${esc(c.title)}</div>
      <div class="upg-mission-block"><b>${t("upg.b.mission_kid")}</b>${esc(c.childTask)}</div>
      <div class="upg-mission-block"><b>${t("upg.b.mission_parent")}</b>${esc(c.parentGuide)}</div>
      <div class="upg-mission-block"><b>${t("upg.b.mission_edu")}</b>${esc(c.eduValue)}</div>
      <div class="upg-mission-actions">
        <button class="btn" onclick="A.approveMission('${m.id}')">${t("upg.b.mission_approve")}</button>
        <button class="btn secondary" onclick="A.skipMission('${m.id}')">${t("upg.b.mission_skip")}</button>
      </div>
    </div>`;
  } catch (e) { return ""; }
};

/* ============================================================
   OVERRIDES — goals
   ============================================================ */
function goalModal(childId) {
  var icons = UPG_GOAL_ICONS.map(function (ic, i) {
    return `<label><input type="radio" name="ngIcon" value="${ic}"${i === 0 ? " checked" : ""}><span>${ic}</span></label>`;
  }).join("");
  openModal(`
    <h3>${t("modal.new_goal")}</h3>
    <div class="field"><label>${t("modal.goal_name")}</label><input id="ngTitle" placeholder="${t("modal.goal_name_ph")}"></div>
    <div class="field"><label>${t("modal.goal_target")}</label><input id="ngTarget" type="number" min="1" step="1" value="100"></div>
    <div class="field"><label>${t("upg.b.goal_icon_lbl")}</label><div class="upg-icon-grid" role="radiogroup">${icons}</div></div>
    <button class="btn" onclick="A.doCreateGoal('${childId}')">${t("modal.create_goal")}</button>
    <button class="btn secondary" onclick="A.closeModal()">${t("common.cancel")}</button>`);
}

function depositModal(goalId) {
  var g = S.goals.find(function (x) { return x.id === goalId; });
  if (!g) return;
  var c = S.children.find(function (x) { return x.id === g.childId; });
  var saveAg = c ? c.money.save : 0;
  var maxSh = Math.floor(saveAg / 100);
  /* One operation id per modal open: a double-click re-sends the SAME op
   * (blocked by idempotency), an intentional repeat opens a new modal
   * with a NEW op id (always saved). */
  var opId = uid();
  openModal(`
    <h3>${t("modal.deposit_title", esc(g.title))}</h3>
    <p class="muted">${t("modal.save_balance", fmtAg(saveAg))}</p>
    <input type="hidden" id="depOpId" value="${opId}">
    <div class="field"><label>${t("modal.deposit_amt")}</label>
    <input id="depAmt" type="number" min="1" step="1" max="${maxSh}"
      value="${maxSh >= 10 ? 10 : (maxSh || "")}"
      oninput="A.depValidate('${goalId}')"></div>
    <div id="depWarn" class="upg-err" style="display:none"></div>
    <button class="btn" id="depSubmit" onclick="A.doDeposit('${goalId}')">${t("modal.deposit")}</button>
    <button class="btn secondary" onclick="A.closeModal()">${t("common.cancel")}</button>`);
  A.depValidate(goalId);
}

function goalCard(child) {
  var goals = childGoals(child.id);
  var isParent = S.mode === "parent";
  if (!goals.length) {
    return `<div class="card">
      <div class="section-title" style="margin-top:0">${isParent ? t("goal.next_parent") : t("goal.next_kids")}</div>
      <p class="muted">${t("goal.none_text")}</p>
      ${isParent ? `<button class="btn secondary" onclick="A.go('manage')">${t("goal.goto_manage")}</button>` : ""}
    </div>`;
  }
  var mainId = child.mainGoalId || goals[0].id;
  var g = goals.find(function (x) { return x.id === mainId; }) || goals[0];
  var pct = upgGoalPct(g);
  var done100 = pct >= 100;
  var isMain = child.mainGoalId === g.id || (!child.mainGoalId && goals[0].id === g.id);
  var marks = [25, 50, 75, 100].map(function (mk) {
    return `<span class="upg-ms${pct >= mk ? " hit" : ""}" style="--pos:${mk}%" title="${t("upg.b.goal_ms_title", mk)}"></span>`;
  }).join("");
  var others = goals.filter(function (x) { return x.id !== g.id; });
  var othersHtml = "";
  if (isParent && others.length) {
    othersHtml = `<div class="upg-other-goals"><div class="upg-task-meta">${t("upg.b.goal_other")}</div>` +
      others.map(function (o) {
        var op = upgGoalPct(o);
        return `<div class="upg-other-row">
          <button class="upg-star" onclick="A.toggleMainGoal('${child.id}','${o.id}')" title="${t("upg.b.goal_star_title")}" aria-label="${t("upg.b.goal_star_title")}: ${esc(o.title)}">☆</button>
          <span style="font-size:20px">${esc(o.icon || "🎯")}</span>
          <span style="flex:1"><b>${esc(o.title)}</b><br><span class="muted" style="font-size:12px">${fmtAg(o.saved)} / ${fmtAg(o.target)} (${op}%)</span></span>
        </div>`;
      }).join("") + `</div>`;
  }
  return `<div class="card upg-goal">
    <div class="section-title" style="margin-top:0">${isParent ? t("goal.next_parent") : t("goal.next_kids")}</div>
    <div class="upg-goal-head">
      <div class="upg-goal-ico">${esc(g.icon || "🎯")}</div>
      <div style="flex:1;min-width:0">
        <div class="upg-goal-title">${esc(g.title)}</div>
        <div class="upg-goal-amounts">${fmtAg(g.saved)} / ${fmtAg(g.target)} · ${pct}%</div>
      </div>
      ${isParent
        ? `<button class="upg-star${isMain ? " on" : ""}" onclick="A.toggleMainGoal('${child.id}','${g.id}')" title="${t("upg.b.goal_star_title")}" aria-label="${t("upg.b.goal_star_title")}: ${esc(g.title)}">${isMain ? "★" : "☆"}</button>`
        : (isMain ? `<span class="upg-badge">${t("upg.b.goal_main_badge")}</span>` : "")}
    </div>
    <div class="upg-pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(g.title)}">
      <i class="upg-fill" style="width:${pct}%"></i>${marks}
    </div>
    <div class="upg-ms-lbls"><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
    ${done100
      ? `<div class="upg-goal-done">${t("upg.b.goal_100_badge")}</div>
         ${isParent ? `<button class="btn" style="margin-top:10px;width:100%" onclick="A.openGoal('${child.id}')">${t("upg.b.goal_new_cta")}</button>` : ""}`
      : (isParent ? `<button class="btn small" style="margin-top:10px" onclick="A.openDeposit('${g.id}')">${t("goal.deposit")}</button>` : "")}
    ${othersHtml}
  </div>`;
}

/* ============================================================
   OVERRIDES — parent tasks
   ============================================================ */
function parentTasks() {
  var child = activeChild();
  var pending = childTasks(child ? child.id : null, "pending");
  var open = childTasks(child ? child.id : null, "open");
  var done = childTasks(child ? child.id : null, "approved").slice(0, 10);

  var metaLine = function (task) {
    var bits = [t("common.points_plus", task.points)];
    var mAg = Math.round(Number(task.moneyAg) || 0);
    if (mAg > 0) bits.push(t("upg.b.task_reward_money", fmtAg(mAg)));
    if (task.dueTs) bits.push(t("upg.b.task_due", fmtDate(task.dueTs)));
    if (task.recurring === "daily") bits.push(t("upg.b.task_recur_daily_badge"));
    else if (task.recurring === "weekly") bits.push(t("upg.b.task_recur_weekly_badge"));
    if (task.kind === "mission") bits.push("🎯");
    return bits.join(" · ");
  };

  var taskRow = function (task, actions) {
    var c = S.children.find(function (x) { return x.id === task.childId; });
    return `<div class="row-item">
      <div class="icon-badge">${task.status === "pending" ? "⏳" : task.status === "approved" ? "✅" : "📝"}</div>
      <div class="grow"><div style="font-weight:700">${esc(task.title)}</div>
      <div class="sub">${c ? esc(c.name) + " · " : ""}${metaLine(task)}</div>
      ${task.desc ? `<div class="upg-task-meta">${esc(task.desc)}</div>` : ""}
      ${task.rejectReason ? `<div class="upg-reject-note">${t("upg.b.task_reject_reason", esc(task.rejectReason))}</div>` : ""}
      </div>
      ${actions || ""}
    </div>`;
  };

  var pendingActions = function (task) {
    if (window.__upgRejecting === task.id) {
      return `<div class="upg-reject-form">
        <input id="upgRej-${task.id}" placeholder="${t("upg.b.task_reject_ph")}" aria-label="${t("upg.b.task_reject")}">
        <button class="btn small" onclick="A.confirmRejectTask('${task.id}')">${t("upg.b.task_reject_ok")}</button>
        <button class="btn small secondary" onclick="A.cancelRejectTask()">${t("common.cancel")}</button>
      </div>`;
    }
    return `<div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn small" onclick="A.approveTask('${task.id}')">${t("common.approve")}</button>
      <button class="btn small secondary" onclick="A.rejectTask('${task.id}')">${t("upg.b.task_reject")}</button>
    </div>`;
  };

  return `<div class="screen">
    <h2 style="margin:6px 0 2px">${t("tasks.title")}</h2>
    <div class="section-title">${t("tasks.pending", pending.length)}</div>
    <div class="card" style="margin-top:6px">
      ${pending.length ? pending.map(function (task) { return taskRow(task, pendingActions(task)); }).join("")
        : `<div class="empty">${t("tasks.no_pending")}</div>`}
    </div>
    <div class="section-title">${t("tasks.new")}</div>
    <div class="card" style="margin-top:6px">
      ${S.children.length === 0 ? `<div class="empty">${t("tasks.no_child")}</div>`
        : `<button class="btn" onclick="A.openTaskModal()">${t("upg.b.task_new_btn")}</button>`}
    </div>
    <div class="section-title">${t("tasks.open", open.length)}</div>
    <div class="card" style="margin-top:6px">
      ${open.length ? open.map(function (task) { return taskRow(task); }).join("") : `<div class="empty">${t("tasks.no_open")}</div>`}
    </div>
    ${done.length ? `<div class="section-title">${t("tasks.recent")}</div>
    <div class="card" style="margin-top:6px">${done.map(function (task) { return taskRow(task); }).join("")}</div>` : ""}
  </div>`;
}

/* ============================================================
   OVERRIDES — kids
   ============================================================ */
function kidsTasks() {
  var child = activeChild();
  if (!child) return kidsHome();
  var open = childTasks(child.id, "open").filter(function (x) { return x.kind !== "mission"; });
  var missions = childTasks(child.id, "open").filter(function (x) { return x.kind === "mission"; });
  var pending = childTasks(child.id, "pending");
  var row = function (task, btn, badge) {
    var mAg = Math.round(Number(task.moneyAg) || 0);
    return `<div class="row-item${badge ? " upg-kid-mission" : ""}">
      <div class="icon-badge">${badge || (task.status === "pending" ? "⏳" : "📝")}</div>
      <div class="grow"><div style="font-weight:700">${esc(task.title)}</div>
      <div class="sub">${t("common.points_plus", task.points)}${mAg > 0 ? " · " + t("upg.b.task_reward_money", fmtAg(mAg)) : ""}${task.status === "pending" ? t("kids.wait_parent") : ""}</div>
      ${task.desc ? `<div class="upg-task-meta">${esc(task.desc)}</div>` : ""}
      ${task.rejectReason ? `<div class="upg-reject-note">${t("upg.b.task_reject_reason", esc(task.rejectReason))}</div>` : ""}
      </div>
      ${btn || ""}
    </div>`;
  };
  return `<div class="screen">
    <h2 style="margin:6px 0 2px">${t("kids.tasks_title")}</h2>
    ${missions.length ? `<div class="section-title">${t("upg.b.mission_section")}</div>
    <div class="card" style="margin-top:6px">${missions.map(function (task) {
      return row(task, `<button class="btn small" onclick="A.doneMission('${task.id}')">${t("kids.done_btn")}</button>`, "🚀");
    }).join("")}</div>` : ""}
    <div class="card">${open.length ? open.map(function (task) {
      return row(task, `<button class="btn small" onclick="A.completeTask('${task.id}')">${t("kids.done_btn")}</button>`);
    }).join("") : `<div class="empty">${t("kids.no_open")}</div>`}</div>
    ${pending.length ? `<div class="section-title">${t("kids.pending_approval")}</div><div class="card" style="margin-top:6px">${pending.map(function (task) { return row(task); }).join("")}</div>` : ""}
  </div>`;
}

function kidsHome() {
  var child = activeChild();
  if (!child) return `<div class="screen"><div class="card" style="text-align:center">
    <div style="font-size:56px">🐷</div><p class="muted">${t("kids.no_child")}</p></div></div>`;
  var myTasks = childTasks(child.id, "open").filter(function (x) { return x.kind !== "mission"; }).slice(0, 5);
  var tasksHtml = myTasks.length === 0
    ? `<div class="empty">${t("kids.all_done")}<br><span class="muted">${t("kids.no_open_tasks")}</span></div>`
    : myTasks.map(function (task) {
      return `<div class="row-item">
        <div class="icon-badge">📝</div>
        <div class="grow"><div style="font-weight:700">${esc(task.title)}</div>
        <div class="sub">${t("common.points_plus", task.points)}</div></div>
        <button class="btn small" onclick="A.completeTask('${task.id}')">${t("kids.done_btn")}</button>
      </div>`;
    }).join("");
  var ach = (child.achievements || []).filter(function (a) { return UPG_ACH[a.id]; });
  var achHtml = ach.length
    ? `<div class="card"><div class="section-title" style="margin-top:0">${t("upg.b.ach_title")}</div>
       <div class="upg-ach-row">${ach.map(function (a) {
         return `<span class="upg-ach">${UPG_ACH[a.id].icon} ${t(UPG_ACH[a.id].key)}</span>`;
       }).join("")}</div></div>` : "";
  var streakHtml = (child.streak > 0)
    ? `<div class="upg-center" style="margin:8px 0"><span class="upg-badge">${t("upg.b.streak", child.streak)}</span></div>` : "";

  return `<div class="screen">
    ${avatarHero(child)}
    ${streakHtml}
    ${goalCard(child)}
    ${achHtml}
    <div class="card dark">${moneyCols(child.money)}</div>
    <div class="card">
      <div class="section-title" style="margin-top:0">${t("kids.my_tasks")}</div>
      ${tasksHtml}
    </div>
  </div>`;
}

/* ============================================================
   A.* — new & overridden actions
   ============================================================ */
Object.assign(A, {
  /* re-point (A captured the old function objects at literal creation) */
  openGoal: goalModal,
  openDeposit: depositModal,

  doCreateGoal: function (childId) {
    var titleEl = document.getElementById("ngTitle");
    var title = titleEl ? (titleEl.value || "").trim() : "";
    var tgtEl = document.getElementById("ngTarget");
    var targetAg = toAg(tgtEl ? tgtEl.value : 0);
    if (!title) { toast(t("toast.goal_name")); return; }
    if (targetAg <= 0) { toast(t("toast.amount")); return; }
    var iconEl = document.querySelector('input[name="ngIcon"]:checked');
    var icon = iconEl ? iconEl.value : UPG_GOAL_ICONS[0];
    var c = S.children.find(function (x) { return x.id === childId; });
    var g = { id: uid(), childId: childId, title: title, target: targetAg, saved: 0, icon: icon };
    S.goals.push(g);
    if (c && !c.mainGoalId) c.mainGoalId = g.id;
    logActivity(t("log.goal_created", title, fmtAg(targetAg)));
    Analytics.track("goal_created");
    save(); A.closeModal(); renderApp();
    toast(t("toast.goal_created"));
  },

  toggleMainGoal: function (childId, goalId) {
    var c = S.children.find(function (x) { return x.id === childId; });
    if (!c) return;
    c.mainGoalId = (c.mainGoalId === goalId) ? null : goalId;
    save(); renderApp();
  },

  /* Parent picks the main goal directly: exactly one main goal. */
  setMainGoal: function (childId, goalId) {
    var c = S.children.find(function (x) { return x.id === childId; });
    if (!c) return;
    if (!(S.goals || []).some(function (x) { return x.id === goalId && x.childId === childId; })) return;
    c.mainGoalId = goalId;
    save(); renderApp();
    toast(t("upg.b.goal_main_set"));
  },

  /* Live validation for the deposit modal: the submit button is disabled
   * while the requested amount is not a valid, covered deposit. */
  depValidate: function (goalId) {
    var g = S.goals.find(function (x) { return x.id === goalId; });
    if (!g) return false;
    var c = S.children.find(function (x) { return x.id === g.childId; });
    var saveAg = c ? c.money.save : 0;
    var amtEl = document.getElementById("depAmt");
    var btn = document.getElementById("depSubmit");
    var warn = document.getElementById("depWarn");
    var amtAg = toAg(amtEl ? amtEl.value : 0);
    var over = amtAg > saveAg;
    var bad = !(amtAg > 0);
    if (warn) {
      if (over) {
        warn.style.display = "";
        warn.innerHTML = "⚠️ " + t("upg.b.dep_over") + '<br><span class="muted">' +
          t("upg.b.dep_avail_req", fmtAg(saveAg), fmtAg(amtAg)) + "</span>";
      } else {
        warn.style.display = "none";
      }
    }
    if (btn) btn.disabled = over || bad;
    return !over && !bad;
  },

  doDeposit: function (goalId) {
    var g = S.goals.find(function (x) { return x.id === goalId; });
    if (!g) return;
    var c = S.children.find(function (x) { return x.id === g.childId; });
    if (!c) return;
    if (!A.depValidate(goalId)) {
      var amtAg0 = toAg((document.getElementById("depAmt") || {}).value || 0);
      toast(amtAg0 > c.money.save ? t("upg.b.deposit_blocked") : t("toast.bad_amount"));
      return;
    }
    var opIdEl = document.getElementById("depOpId");
    var opId = (opIdEl && opIdEl.value) ? opIdEl.value : uid();
    /* Double-click protection: disable submit immediately; the same opId
     * can never be applied twice thanks to onceOp below. */
    var btn = document.getElementById("depSubmit");
    if (btn) { btn.disabled = true; btn.textContent = t("upg.b.dep_saving"); }
    var amtAg = toAg(document.getElementById("depAmt").value);
    var before = upgGoalPct(g);
    var celebrated = false;
    /* Idempotency key = the operation id, NOT goal+amount+day:
     * same op resent -> no-op; new op (even same amount/day) -> new deposit. */
    var ok = onceOp("deposit-" + opId, function () {
      c.money.save -= amtAg;
      g.saved += amtAg;
      addTx({ childId: c.id, boxId: "save", amountAg: -amtAg, type: "transfer",
              source: "goal_deposit", note: g.title, by: "parent" });
      if (before < 100 && upgGoalPct(g) >= 100) {
        celebrated = true;
        upgConfetti();
        upgAwardAch(c, "goal_crusher");
      }
      return true;
    });
    if (!ok) { A.closeModal(); renderApp(); return; }
    logActivity(t("log.deposited", fmtAg(amtAg), g.title));
    save(); A.closeModal(); renderApp();
    toast(celebrated ? t("upg.b.goal_100_msg", fmtAg(g.target)) : t("toast.deposited"));
  },

  /* ---- task modal ---- */
  openTaskModal: function (childId) {
    var child = activeChild();
    if (childId && S.children.some(function (c) { return c.id === childId; })) {
      child = S.children.find(function (c) { return c.id === childId; });
    }
    if (!S.children.length) { toast(t("tasks.no_child")); return; }
    var opts = S.children.map(function (c) {
      return `<option value="${c.id}"${child && c.id === child.id ? " selected" : ""}>${esc(c.name)}</option>`;
    }).join("");
    openModal(`
      <h3>${t("upg.b.task_modal_title")}</h3>
      <div class="field"><label>${t("tasks.child_lbl")}</label><select id="ntChild">${opts}</select></div>
      <div class="field"><label>${t("upg.b.task_title_lbl")}</label><input id="ntTitle" placeholder="${t("upg.b.task_title_ph")}"></div>
      <div class="field"><label>${t("upg.b.task_desc_lbl")}</label><input id="ntDesc" placeholder="${t("upg.b.task_desc_ph")}"></div>
      <div class="split-3">
        <div class="field"><label>${t("upg.b.task_points_lbl")}</label><input id="ntPoints" type="number" min="1" step="1" value="10"></div>
        <div class="field"><label>${t("upg.b.task_money_lbl")}</label><input id="ntMoney" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label>${t("upg.b.task_due_lbl")}</label><input id="ntDue" type="date"></div>
      </div>
      <div class="field"><label>${t("upg.b.task_recur_lbl")}</label><select id="ntRecur">
        <option value="once">${t("upg.b.task_recur_once")}</option>
        <option value="daily">${t("upg.b.task_recur_daily")}</option>
        <option value="weekly">${t("upg.b.task_recur_weekly")}</option>
      </select></div>
      <div class="field"><label style="display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer"><input type="checkbox" id="ntAppr" checked style="width:22px;height:22px">${t("upg.b.task_approval_lbl")}</label></div>
      <button class="btn" onclick="A.doCreateTask()">${t("upg.b.task_create_btn")}</button>
      <button class="btn secondary" onclick="A.closeModal()">${t("common.cancel")}</button>`);
  },
  doCreateTask: function () {
    var childId = document.getElementById("ntChild").value;
    var title = (document.getElementById("ntTitle").value || "").trim();
    var desc = (document.getElementById("ntDesc").value || "").trim();
    var points = Math.max(1, Math.round(Number(document.getElementById("ntPoints").value) || 10));
    var moneyAg = Math.max(0, toAg(document.getElementById("ntMoney").value || 0));
    var dueVal = document.getElementById("ntDue").value;
    var dueTs = dueVal ? new Date(dueVal + "T12:00:00").getTime() : null;
    var recurring = document.getElementById("ntRecur").value || "once";
    var appr = document.getElementById("ntAppr").checked;
    if (!title) { toast(t("toast.task_desc")); return; }
    S.tasks.push({
      id: uid(), childId: childId, title: title, desc: desc, points: points,
      moneyAg: moneyAg, status: "open", recurring: recurring,
      requiresApproval: appr, dueTs: dueTs, rejectReason: null, created: Date.now()
    });
    Analytics.track("task_created");
    save(); A.closeModal(); renderApp();
    toast(t("toast.task_added"));
  },
  /* legacy entry point -> modal */
  createTask: function () { A.openTaskModal(); },

  completeTask: function (id) {
    var tsk = S.tasks.find(function (x) { return x.id === id; });
    if (!tsk || tsk.status !== "open") return;
    if (tsk.requiresApproval === false) {
      /* no-approval task: completing awards immediately (idempotent) */
      var c = S.children.find(function (x) { return x.id === tsk.childId; });
      var res = null;
      onceOp("task-approve-" + tsk.id, function () { res = upgAwardTask(tsk, c); });
      save(); renderApp();
      if (res) {
        Analytics.track("task_approved");
        toast(t("upg.b.task_auto_approved", res.pts));
      }
      return;
    }
    tsk.status = "pending";
    save(); renderApp();
    toast(t("toast.task_done"));
  },

  approveTask: function (id) {
    var tsk = S.tasks.find(function (x) { return x.id === id; });
    if (!tsk || tsk.status !== "pending") return;
    var c = S.children.find(function (x) { return x.id === tsk.childId; });
    var res = null;
    onceOp("task-approve-" + tsk.id, function () { res = upgAwardTask(tsk, c); });
    save(); renderApp();
    if (res) {
      Analytics.track("task_approved");
      logActivity(t("log.task_approved", c ? c.name : "", tsk.title, res.pts));
      if (res.mAg > 0) toast(t("upg.b.task_approved_money", res.pts, fmtAg(res.mAg), c ? c.name : ""));
      else toast(t("toast.approved", res.pts, c ? c.name : ""));
    }
  },

  /* ---- reject with reason (inline) ---- */
  rejectTask: function (id) {
    window.__upgRejecting = id;
    renderApp();
  },
  cancelRejectTask: function () {
    window.__upgRejecting = null;
    renderApp();
  },
  confirmRejectTask: function (id) {
    var tsk = S.tasks.find(function (x) { return x.id === id; });
    if (!tsk) { window.__upgRejecting = null; renderApp(); return; }
    var inp = document.getElementById("upgRej-" + id);
    var reason = inp ? (inp.value || "").trim() : "";
    if (!reason) { toast(t("upg.b.task_reject_need")); return; }
    tsk.status = "open";
    tsk.rejectReason = reason;
    window.__upgRejecting = null;
    save(); renderApp();
    toast(t("upg.b.task_rejected"));
  },

  /* ---- daily missions (parent-approved, no open chat) ---- */
  approveMission: function (mid) {
    var m = null;
    if (typeof AIService !== "undefined" && AIService.bank) {
      m = AIService.bank.find(function (x) { return x.id === mid; });
    }
    var child = activeChild();
    if (!m || !child) return;
    var c = upgLoc(m);
    S.tasks.push({
      id: uid(), childId: child.id, title: c.title, desc: c.childTask,
      points: m.coins, moneyAg: 0, status: "open",
      recurring: "once", requiresApproval: false,
      kind: "mission", missionId: m.id, dueTs: null, rejectReason: null,
      created: Date.now()
    });
    AIService.markDone(m.id);
    Analytics.track("mission_approved");
    logActivity(t("upg.b.mission_approved", child.name));
    save(); renderApp();
    toast(t("upg.b.mission_approved", child.name));
  },
  skipMission: function (mid) {
    if (typeof AIService !== "undefined") AIService.markDone(mid);
    save(); renderApp();
    toast(t("upg.b.mission_skipped"));
  },
  doneMission: function (taskId) {
    var tsk = S.tasks.find(function (x) { return x.id === taskId; });
    if (!tsk || tsk.status !== "open") return;
    var c = S.children.find(function (x) { return x.id === tsk.childId; });
    var pts = Math.round(Number(tsk.points) || 0);
    var ok = onceOp("mission-done-" + tsk.id, function () {
      tsk.status = "approved";
      tsk.approvedAt = Date.now();
      if (c) {
        c.points += pts;
        upgBumpStreak(c);
        upgAwardAch(c, "first_task");
        var mc = S.tasks.filter(function (x) {
          return x.childId === c.id && x.kind === "mission" && x.status === "approved";
        }).length;
        if (mc >= 10) upgAwardAch(c, "mission_10");
      }
      Analytics.track("task_completed");
      return true;
    });
    save(); renderApp();
    if (ok) toast(t("upg.b.mission_done_toast", pts));
  }
});

</script>

function openBugModal() {

      '<input id="bugTried" placeholder="' + t("upg.c.bug_tried_ph") + '"></div>' +
    '<div class="upg-btn-row">' +
      '<button class="btn" onclick="A.submitBugReport()">' + t("upg.c.bug_send") + '</button>' +
      '<button class="btn secondary" onclick="A.closeModal()">' + t("upg.c.close") + '</button>' +
    '</div>'
  );
}
function submitBugReport() {
  var d = ((document.getElementById("bugDesc") || {}).value || "").trim();
  var tr = ((document.getElementById("bugTried") || {}).value || "").trim();
  if (!d) { toast(t("upg.c.bug_empty")); return; }
  var full = d + (tr ? "\n\n" + t("upg.c.bug_tried_prefix") + tr : "");
  /* Real mailto send through the user's own mail app + local outbox log.
     We never claim "sent" — the user still has to press Send. */
  EmailService.sendBugReport(full);
  var m = EmailService.composeBugReport(full);
  window.__upgBugMail = m;
  window.__upgBugMailto = "mailto:" + encodeURIComponent(m.to) +
    "?subject=" + encodeURIComponent(m.subject) +
    "&body=" + encodeURIComponent(m.body);
  openModal(
    '<h3>✅ ' + t("upg.c.bug_title") + '</h3>' +
    '<p class="muted">' + t("upg.c.bug_opened_t") + '</p>' +
    '<div class="upg-btn-row">' +
      '<button class="btn" onclick="A.copyBugReport()">' + t("upg.c.bug_copy") + '</button>' +
      '<button class="btn secondary" onclick="A.reopenBugMail()">' + t("upg.c.bug_reopen") + '</button>' +
    '</div>' +
    '<div class="upg-btn-row">' +
      '<button class="btn secondary" onclick="A.closeModal()">' + t("upg.c.close") + '</button>' +
    '</div>'
  );
}
function fallbackCopyText(text) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  } catch (e) {}
}
function copyBugReport() {
  var m = window.__upgBugMail;
  if (!m) return;
  var text = m.subject + "\n\n" + m.body;
  var done = function () { toast(t("upg.c.bug_copied")); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopyText(text); done(); });
  } else {
    fallbackCopyText(text);
    done();
  }
}
function reopenBugMail() {
  if (window.__upgBugMailto) window.location.href = window.__upgBugMailto;
}

/* ---------------- data: export + safe delete ---------------- */
function careExportData() {
  var payload = Store.exportData(); /* readable JSON, no secrets — there are none */
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "piggyup-data.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { try { URL.revokeObjectURL(a.href); } catch (e) {} a.remove(); }, 500);
  toast(t("upg.c.data_export_ok"));
}

<script>
/* ===== chunk js: 40-onboarding ===== */
/* ============================================================
   40 — Onboarding wizard (NEW USERS ONLY)

   Never shown when existing data is present: children, goals,
   ledger, tasks, activity, or a started trial all count as
   existing data. Completed once: S.onboarded = true.

   Flow: Welcome -> Language -> Parent -> Child -> Avatar ->
   Split -> Goal (optional) -> About -> Trial -> First Mission.

   Everything is drafted in memory and committed atomically at
   the end (child + split rule + goal + trial). No PII beyond a
   display name is ever requested: no birth date, no address,
   no phone number.
   ============================================================ */

var UPG_ONB_AVATARS = ["🐷", "🐰", "🦊", "🐼", "🦁", "🐯", "🐸", "🦄"];
var UPG_ONB_AGES = [
  { id: "6-8", key: "upg.o.age_6_8" },
  { id: "9-11", key: "upg.o.age_9_11" },
  { id: "12+", key: "upg.o.age_12p" }
];

function upgHasExistingData() {
  try {
    return (S.children || []).length > 0 ||
      (S.goals || []).length > 0 ||
      (S.ledger || []).length > 0 ||
      (S.tasks || []).length > 0 ||
      (S.activity || []).length > 0 ||
      !!(S.sub && S.sub.trialStart);
  } catch (e) { return true; }
}

var UpgOnb = {
  i: 0,
  draft: null,
  steps: ["welcome", "lang", "parent", "child", "avatar", "split", "goal", "about", "trial", "done"],

  start: function () {
    this.i = 0;
    /* Language gate already asked on first entry: drop the in-wizard
       lang step so the user is not asked twice. */
    if (typeof UpgLangGate !== "undefined" && UpgLangGate.shown) {
      var li = this.steps.indexOf("lang");
      if (li >= 0) this.steps.splice(li, 1);
    }
    this.draft = {
      parentName: "", childName: "", ageGroup: "6-8", avatar: "🐷",
      split: { save: 30, invest: 20, spend: 50 },
      goalTitle: "", goalTarget: "", trial: false
    };
    this.render();
  },

  go: function (n) {
    this.i = Math.max(0, Math.min(this.steps.length - 1, n));
    this.render();
  },

  next: function () { this.go(this.i + 1); },
  back: function () { this.go(this.i - 1); },

  /* ---------- per-step "next" with validation ---------- */
  nextFrom: function (step) {
    var d = this.draft;
    if (step === "parent") {
      var p = document.getElementById("onbParent");
      d.parentName = p ? p.value.trim() : "";
      if (!d.parentName) { toast(t("upg.o.parent_need")); return; }
    }
    if (step === "child") {
      var c = document.getElementById("onbChild");
      d.childName = c ? c.value.trim() : "";
      if (!d.childName) { toast(t("upg.o.child_need")); return; }
    }
    if (step === "split") {
      var s = this.readSplit();
      if (s.save + s.invest + s.spend !== 100) { toast(t("upg.o.split_need100")); return; }
      d.split = s;
    }
    if (step === "goal") {
      var gt = document.getElementById("onbGoalTitle");
      var gv = document.getElementById("onbGoalTarget");
      d.goalTitle = gt ? gt.value.trim() : "";
      d.goalTarget = gv ? gv.value.trim() : "";
      if (d.goalTitle && toAg(d.goalTarget) <= 0) { toast(t("toast.amount")); return; }
    }
    this.next();
  },

  readSplit: function () {
    function num(id) {
      var el = document.getElementById(id);
      var v = el ? parseInt(el.value, 10) : 0;
      return isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
    }
    return { save: num("onbSplitSave"), invest: num("onbSplitInvest"), spend: num("onbSplitSpend") };
  },

  splitPreview: function () {
    var s = this.readSplit();
    var sum = s.save + s.invest + s.spend;
    var sumEl = document.getElementById("onbSplitSum");
    if (sumEl) sumEl.textContent = t("upg.o.split_sum", sum);
    var btn = document.getElementById("onbSplitNext");
    if (btn) btn.disabled = sum !== 100;
  },

  pickAvatar: function (a) {
    this.draft.avatar = a;
    var els = document.querySelectorAll(".upg-onb-avatar");
    for (var k = 0; k < els.length; k++) {
      els[k].classList.toggle("on", els[k].getAttribute("data-a") === a);
    }
  },

  pickAge: function (id) {
    this.draft.ageGroup = id;
    var els = document.querySelectorAll(".upg-onb-age");
    for (var k = 0; k < els.length; k++) {
      els[k].classList.toggle("on", els[k].getAttribute("data-a") === id);
    }
  },

  pickTrial: function (yes) {
    this.draft.trial = !!yes;
    this.next();
  },

  /* ---------- rendering ---------- */
  dots: function () {
    var h = '<div class="upg-onb-dots">';
    for (var k = 0; k < this.steps.length; k++) {
      h += '<span class="upg-onb-dot' + (k === this.i ? " on" : "") + '"></span>';
    }
    return h + "</div>";
  },

  nav: function (step, opts) {
    opts = opts || {};
    var h = '<div class="upg-onb-nav">';
    if (this.i > 0) h += '<button class="btn small secondary" onclick="UpgOnb.back()">' + t("upg.o.back") + "</button>";
    else h += "<span></span>";
    if (opts.skip) h += '<button class="btn small secondary" onclick="UpgOnb.next()">' + t("upg.o.skip") + "</button>";
    if (opts.custom) h += opts.custom;
    else if (!opts.skip || opts.keepNext) h += '<button class="btn small" id="' + (opts.nextId || "onbNext") + '" onclick="UpgOnb.nextFrom(\'' + step + '\')">' + t("upg.o.next") + "</button>";
    return h + "</div>";
  },

  stepHtml: function (step) {
    var d = this.draft;
    switch (step) {
      case "welcome":
        return '<div class="upg-onb-hero">🐷</div>' +
          '<h2>' + t("upg.o.welcome_title") + "</h2>" +
          '<p class="muted">' + t("upg.o.welcome_sub") + "</p>" +
          '<button class="btn big" onclick="UpgOnb.next()">' + t("upg.o.start") + "</button>";

      case "lang":
        return "<h2>" + t("upg.o.lang_title") + "</h2>" +
          '<div class="upg-onb-row">' +
          '<button class="btn big secondary" onclick="A.setLang(\'he\');UpgOnb.render()">עברית</button>' +
          '<button class="btn big secondary" onclick="A.setLang(\'ru\');UpgOnb.render()">Русский</button>' +
          "</div>" + this.nav("lang");

      case "parent":
        return "<h2>" + t("upg.o.parent_title") + "</h2>" +
          '<input id="onbParent" class="upg-onb-input" maxlength="30" placeholder="' + esc(t("upg.o.parent_ph")) +
          '" value="' + esc(d.parentName) + '">' + this.nav("parent");

      case "child":
        return "<h2>" + t("upg.o.child_title") + "</h2>" +
          '<input id="onbChild" class="upg-onb-input" maxlength="30" placeholder="' + esc(t("upg.o.child_ph")) +
          '" value="' + esc(d.childName) + '">' +
          '<div class="upg-onb-label">' + t("upg.o.age_title") + "</div>" +
          '<div class="upg-onb-ages">' + UPG_ONB_AGES.map(function (a) {
            return '<button class="upg-onb-age' + (d.ageGroup === a.id ? " on" : "") +
              '" data-a="' + a.id + '" onclick="UpgOnb.pickAge(\'' + a.id + "')\">" + t(a.key) + "</button>";
          }).join("") + "</div>" + this.nav("child");

      case "avatar":
        return "<h2>" + t("upg.o.avatar_title") + "</h2>" +
          '<p class="muted">' + t("upg.o.avatar_sub") + "</p>" +
          '<div class="upg-onb-avatars">' + UPG_ONB_AVATARS.map(function (a) {
            return '<button class="upg-onb-avatar' + (d.avatar === a ? " on" : "") +
              '" data-a="' + a + '" onclick="UpgOnb.pickAvatar(\'' + a + "')\">" + a + "</button>";
          }).join("") + "</div>" + this.nav("avatar");

      case "split":
        return "<h2>" + t("upg.o.split_title") + "</h2>" +
          '<p class="muted">' + t("upg.o.split_sub") + "</p>" +
          '<div class="upg-onb-split">' +
          this.splitRow("onbSplitSave", "upg.o.split_save", d.split.save) +
          this.splitRow("onbSplitInvest", "upg.o.split_invest", d.split.invest) +
          this.splitRow("onbSplitSpend", "upg.o.split_spend", d.split.spend) +
          "</div>" +
          '<div class="upg-onb-sum" id="onbSplitSum">' + t("upg.o.split_sum", d.split.save + d.split.invest + d.split.spend) + "</div>" +
          this.nav("split", { nextId: "onbSplitNext" });

      case "goal":
        return "<h2>" + t("upg.o.goal_title") + "</h2>" +
          '<p class="muted">' + t("upg.o.goal_sub") + "</p>" +
          '<input id="onbGoalTitle" class="upg-onb-input" maxlength="40" placeholder="' + esc(t("upg.o.goal_name_ph")) +
          '" value="' + esc(d.goalTitle) + '">' +
          '<input id="onbGoalTarget" class="upg-onb-input" inputmode="decimal" placeholder="' + esc(t("upg.o.goal_target_ph")) +
          '" value="' + esc(d.goalTarget) + '">' +
          this.nav("goal", { skip: true, keepNext: true });

      case "about":
        return "<h2>" + t("upg.o.about_title") + "</h2>" +
          '<div class="upg-onb-about">' +
          "<p>" + t("upg.o.about_1") + "</p>" +
          "<p>" + t("upg.o.about_2") + "</p>" +
          "<p>" + t("upg.o.about_3") + "</p></div>" +
          this.nav("about");

      case "trial":
        return '<div class="upg-onb-hero">🎁</div>' +
          "<h2>" + t("upg.o.trial_title") + "</h2>" +
          '<p class="muted">' + t("upg.o.trial_sub") + "</p>" +
          '<div class="upg-onb-row">' +
          '<button class="btn big" onclick="UpgOnb.pickTrial(true)">' + t("upg.o.trial_start") + "</button>" +
          '<button class="btn big secondary" onclick="UpgOnb.pickTrial(false)">' + t("upg.o.trial_later") + "</button>" +
          "</div>" + this.nav("trial", { custom: "<span></span>" });

      case "done":
        return '<div class="upg-onb-hero">🎉</div>' +
          "<h2>" + t("upg.o.done_title") + "</h2>" +
          '<p class="muted">' + t("upg.o.done_sub", esc(d.childName)) + "</p>" +
          '<button class="btn big" onclick="UpgOnb.finish(true)">' + t("upg.o.done_cta") + "</button>";
    }
    return "";
  },

  splitRow: function (id, labelKey, val) {
    return '<label class="upg-onb-splitrow"><span>' + t(labelKey) + "</span>" +
      '<span class="upg-onb-splitin"><input id="' + id + '" type="number" min="0" max="100" value="' + val +
      '" oninput="UpgOnb.splitPreview()">%</span></label>';
  },

  render: function () {
    var old = document.getElementById("upgOnb");
    if (old) old.remove();
    var step = this.steps[this.i];
    var ov = document.createElement("div");
    ov.id = "upgOnb";
    ov.innerHTML = '<div class="upg-onb-card">' + this.dots() +
      '<div class="upg-onb-body">' + this.stepHtml(step) + "</div></div>";
    document.body.appendChild(ov);
    window.scrollTo(0, 0);
    if (step === "split") this.splitPreview();
  },

  /* ---------- atomic commit at the end ---------- */
  finish: function (addMoney) {
    var d = this.draft;
    try {
      var c = {
        id: uid(), name: d.childName, ageGroup: d.ageGroup, avatar: d.avatar,
        points: 0, money: { save: 0, invest: 0, spend: 0 },
        achievements: [], streak: 0, mainGoalId: null
      };
      S.children.push(c);
      S.activeChildId = c.id;
      if (d.parentName) S.parentName = d.parentName;
      S.splitRule = { save: d.split.save, invest: d.split.invest, spend: d.split.spend };
      if (d.goalTitle) {
        var tg = toAg(d.goalTarget);
        if (tg > 0) {
          var g = { id: uid(), childId: c.id, title: d.goalTitle, target: tg, saved: 0, icon: "🎯" };
          S.goals.push(g);
          c.mainGoalId = g.id;
        }
      }
      if (d.trial) {
        S.sub.trialStart = Date.now();
        S.sub.plan = "trial";
        try { Analytics.track("trial_started"); } catch (e) {}
      }
      S.onboarded = true;
      S.mode = "parent";
      S.tab = "home";
      save();
      var ov = document.getElementById("upgOnb");
      if (ov) ov.remove();
      renderApp();
      if (addMoney) A.openAddMoney(c.id);
    } catch (e) {
      toast(t("upg.o.error"));
    }
  }
};

/* Show the onboarding-chosen companion next to the piggy hero. */
(function () {
  try {
    if (typeof avatarHero !== "function") return;
    var baseHero = avatarHero;
    avatarHero = function (child) {
      var html = baseHero(child);
      if (child && child.avatar && child.avatar !== "🐷") {
        html = html.replace("🐷", "🐷" + '<span class="upg-companion">' + esc(child.avatar) + "</span>");
      }
      return html;
    };
  } catch (e) {}
})();

var __upgLangAtBoot = null;
try { __upgLangAtBoot = localStorage.getItem("piggyup_lang"); } catch (e) {}

var UpgLangGate = {
  shown: false,
  done: null,
  show: function (done) {
    this.shown = true;
    this.done = done;
    var old = document.getElementById("upgLangGate");
    if (old) old.remove();
    var ov = document.createElement("div");
    ov.id = "upgLangGate";
    ov.innerHTML = '<div class="upg-onb-card">' +
      '<div class="upg-onb-hero">🌍</div>' +
      "<h2>" + t("upg.o.gate_title") + "</h2>" +
      '<p class="muted">' + t("upg.o.gate_sub") + "</p>" +
      '<div class="upg-onb-row">' +
      '<button class="btn big" onclick="UpgLangGate.pick(\'he\')">🇮🇱 עברית</button>' +
      '<button class="btn big secondary" onclick="UpgLangGate.pick(\'ru\')">🇷🇺 Русский</button>' +
      "</div></div>";
    document.body.appendChild(ov);
    window.scrollTo(0, 0);
  },
  pick: function (l) {
    try { A.setLang(l); } catch (e) {}
    var ov = document.getElementById("upgLangGate");
    if (ov) ov.remove();
    var d = this.done;
    this.done = null;
    if (d) d();
  }
};

/* Boot: new users only, after the app has rendered. */
window.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {
    try {
      if (window.__PIGGYUP_DATA_NEWER__) return;
      if (window.__PIGGYUP_MIGRATION_ERROR__) return;
      if (S.onboarded) return;
      if (upgHasExistingData()) return;
      /* Use the parse-time snapshot: the base setLang(LANG) on
         DOMContentLoaded already persisted the default by now. */
      if (!__upgLangAtBoot) {
        UpgLangGate.show(function () { UpgOnb.start(); });
        return;
      }
      UpgOnb.start();
    } catch (e) {}
  }, 500);
});


</script>

/* ===== chunk js: 50-roles ===== */
/* ============================================================
   50 — Parent Mode + Child Mode (CORE)
   Additive upgrade on top of schema v2. No breaking changes.

   Model:
   - S.family       {id, createdAt}              — one family per data set
   - S.device       {role:"parent"|"child", childId:null} — THIS device
   - S.devices      []                           — connected devices registry
   - S.parentAuth   null | {salt, hash, setAt, fail, lockUntil}
   - S.perms        {childCanCreateGoals:true}
   - child.age / child.independenceAge (null = feature off)

   Security note (documented honestly in PARENT_CHILD_ARCHITECTURE.md):
   the parent code is a client-side SHA-256 obfuscation. It stops a
   curious child, not an attacker with devtools. No fake sync: this
   build works within one browser; cross-device sync is manual
   export/import until a backend exists.
   ============================================================ */

/* ---------- 1. SHA-256 (sync, compact, public-domain style) ---------- */
function rolesSha256(s) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  var maxWord = Math.pow(2, 32), i, j, result = "";

  var hash = rolesSha256.h = rolesSha256.h || [];
  var k = rolesSha256.k = rolesSha256.k || [];
  var pc = k.length, comp = {};

      k[pc++] = (Math.pow(cand, 1 / 3) * maxWord) | 0;

  while (s.length % 64 - 56) s += "\x00";
  for (i = 0; i < s.length; i++) {
    j = s.charCodeAt(i);
    if (j >> 8) return ""; /* ASCII only: salt+code are always ASCII */
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (bitLen / maxWord) | 0;
  words[words.length] = bitLen;
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), old = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {

    }

/* ---------- 2. Roles namespace ---------- */
var Roles = {
  /* data model of permissions: child-allowed vs parent-only actions */
  CHILD_ALLOWED_ACTIONS: ["view_own", "add_money_self", "create_goal",
    "deposit_to_goal", "complete_task", "view_tasks", "view_rewards"],
  PARENT_ONLY_ACTIONS: ["manage_children", "set_allowance", "set_independence_age",

    "delete_child", "system_settings", "approve_task", "issue_device_code",
    "export_data", "import_data", "reset_all", "activate_subscription"],

  /* ----- device / mode ----- */
  isChildDevice: function () {

  parentUnlocked: function () {

  effectiveMode: function () {
