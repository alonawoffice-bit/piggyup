    var rows = (S.ledger || []).filter(function (e) { return e.childId === childId; });
    rows.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    return rows.slice(0, limit || 20);
  }
};
window.Roles = Roles;

/* ---------- 3. Migration v2 -> v2+roles (additive, idempotent, one-time) ---------- */
(function rolesMigrate() {
  try {
    var st = (typeof S !== "undefined") ? S : null;
    if (!st) return;
    if (st.rolesV === 1) return; /* already migrated: nothing to do */

    /* safety: snapshot before first roles migration, only when real user
     * data exists (nothing to back up on a clean boot). Pruned to last 3. */
    try {
      window.__upgMigrating = true;
      var hasData = (st.children || []).length || (st.ledger || []).length ||
        (st.goals || []).length || (st.tasks || []).length || (st.activity || []).length;
      if (hasData) {
        var bkKey = "piggyup_backup_roles_" + Date.now();
        localStorage.setItem(bkKey, JSON.stringify(st));
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf("piggyup_backup_roles_") === 0) keys.push(k);
        }
        keys.sort();
        while (keys.length > 3) localStorage.removeItem(keys.shift());
      }
    } catch (e) {}

    if (!st.family) st.family = { id: uid(), createdAt: Date.now() };
    /* existing users keep full access: their device defaults to parent */
    if (!st.device) st.device = { role: "parent", childId: null };
    if (!Array.isArray(st.devices)) st.devices = [];
    if (!st.perms) st.perms = { childCanCreateGoals: true };
    if (st.parentAuth === undefined) st.parentAuth = null;
    (st.children || []).forEach(function (c) {
      if (c.age === undefined || c.age === null) {
        /* derive a numeric default from the onboarding age group when present */
        c.age = c.ageGroup === "12+" ? 12 : c.ageGroup === "9-11" ? 10 : c.ageGroup === "6-8" ? 7 : null;
      }
      if (c.independenceAge === undefined) c.independenceAge = null;
    });

    st.rolesV = 1;
    st.rolesMigratedAt = Date.now();

    /* verify: same children count, same ledger length, new fields present */
    var before = { children: (st.children || []).length, ledger: (st.ledger || []).length };
    save();
    var ok = (st.children || []).length === before.children &&
             (st.ledger || []).length === before.ledger &&
             !!st.family && !!st.device && !!st.perms;
    if (!ok) {
      try { localStorage.setItem("piggyup_roles_migration_error", JSON.stringify({ ts: Date.now(), before: before })); } catch (e2) {}
    }
    window.__upgMigrating = false;
  } catch (e) {
    try { window.__upgMigrating = false; } catch (e2) {}
  }
})();

/* ---------- 4. Device connection (pairing codes) ---------- */
/* The connection code is NOT the parent control code: two different secrets,
 * enforced here and tested by test #15. */
Roles.issueDeviceCode = function (childId) {
  if (!this.requireParent()) return null;
  var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
  if (!c) return null;
  var code = "";
  var chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  var rec = {
    id: uid(), childId: childId, childName: c.name,
    code: code, issuedAt: Date.now(), expiresAt: Date.now() + 24 * 3600 * 1000,
    redeemed: false, revoked: false, lastSeen: null
  };
  S.devices.push(rec);
  save();
  return rec;
};

Roles.findDeviceCode = function (code) {
  code = String(code || "").trim().toUpperCase();
  return (S.devices || []).filter(function (d) { return d.code === code; })[0] || null;
};

/* Redeem a connection code on THIS device -> becomes a child device.
 * Returns {ok:true, childId} or {ok:false, err:<i18n key>}. */
Roles.redeemDeviceCode = function (code) {
  var rec = this.findDeviceCode(code);
  if (!rec) return { ok: false, err: "upg.r.connect_bad" };
  if (rec.revoked || rec.redeemed) return { ok: false, err: "upg.r.connect_used" };
  if (Date.now() > rec.expiresAt) return { ok: false, err: "upg.r.connect_bad" };
  rec.redeemed = true;
  rec.lastSeen = Date.now();
  S.device = { role: "child", childId: rec.childId };
  window.__rolesUnlocked = false;
  if (!S.children.some(function (c) { return c.id === rec.childId; })) {
    /* code is valid but this device has no family data yet -> import first */
    return { ok: false, err: "upg.r.import_first" };
  }
  S.mode = "kids";
  S.activeChildId = rec.childId;
  S.tab = "home";
  save();
  return { ok: true, childId: rec.childId };
};

Roles.revokeDevice = function (id) {
  if (!this.requireParent()) return false;
  var rec = (S.devices || []).filter(function (d) { return d.id === id; })[0];
  if (!rec) return false;
  rec.revoked = true;
  save();
  return true;
};

/* Unbind THIS device back to a parent device.
 * On a child device the parent code must have unlocked the session first. */
Roles.unbindThisDevice = function () {
  if (this.isChildDevice() && !this.parentUnlocked()) {
    if (typeof toast === "function") toast(t("upg.r.perm_denied"));
    return false;
  }
  S.device = { role: "parent", childId: null };
  window.__rolesUnlocked = false;
  save();
  return true;
};

/* ---------- 5. Family snapshot export / import (manual cross-device sync) ---------- */
Roles.SNAPSHOT_KIND = "piggyup-family-snapshot";
Roles.SNAPSHOT_V = 1;

Roles.exportSnapshot = function () {
  if (this.isChildDevice() && !this.parentUnlocked()) {
    /* Locked child device: export ONLY the bound child's own data.
     * Never other children's data, never parent-only settings (boxes,
     * splitRule, perms, investRule), never device/pairing codes. */
    var bc = this.boundChild();
    if (!bc) return null;
    var cid = bc.id;
    function own(arr) {
      return (arr || []).filter(function (x) { return x && x.childId === cid; });
    }
    var data = {
      family: S.family || null,
      children: (S.children || []).filter(function (c) { return c && c.id === cid; }),
      goals: own(S.goals),
      tasks: own(S.tasks),
      ledger: own(S.ledger),
      activity: (S.activity || []).filter(function (a) { return a && a.childId === cid; }),
      events: [],
      devices: [],
      processedOps: (S.processedOps || []).slice()
    };
    return {
      kind: this.SNAPSHOT_KIND,
      v: this.SNAPSHOT_V,
      familyId: S.family ? S.family.id : null,
      exportedAt: Date.now(),
      scopedChildId: cid,
      data: JSON.parse(JSON.stringify(data)) /* deep copy */
    };
  }
  if (!this.requireParent()) return null;
  return {
    kind: this.SNAPSHOT_KIND,
    v: this.SNAPSHOT_V,
    familyId: S.family ? S.family.id : null,
    exportedAt: Date.now(),
    data: JSON.parse(JSON.stringify(S)) /* deep copy of the whole state */
  };
};

Roles.exportSnapshotText = function () {
  var snap = this.exportSnapshot();
  return snap ? JSON.stringify(snap) : null;
};

/* Idempotent merge by id. Never deletes local data. Returns {ok, added, updated, skipped}
 * or {ok:false, err}. */
Roles.importSnapshot = function (snap) {
  try {
    if (!snap || snap.kind !== this.SNAPSHOT_KIND || !snap.data) {
      return { ok: false, err: "upg.r.import_bad" };
    }
    var d = snap.data;
    var localHasData = (S.children || []).length || (S.ledger || []).length ||
      (S.goals || []).length || (S.tasks || []).length;
    if (!localHasData) {
      /* empty device: adopt the incoming family identity (the migration may
       * have created a throwaway family id for the empty state) */
      if (d.family) S.family = d.family;
    } else if (d.family && S.family && d.family.id !== S.family.id) {
      return { ok: false, err: "upg.r.import_family_mismatch" };
    }
    if (!S.family && d.family) S.family = d.family;

    var added = 0, updated = 0;
    function mergeArr(key) {
      var local = S[key] || (S[key] = []);
      var index = {};
      local.forEach(function (x, i) { if (x && x.id) index[x.id] = i; });
      (d[key] || []).forEach(function (x) {
        if (!x || !x.id) return;
        if (index[x.id] === undefined) { local.push(x); added++; }
        else {
          /* update mutable child fields (age, independenceAge, name, avatar)
           * but never touch money: balances are rebuilt from the ledger */
          var cur = local[index[x.id]];
          if (key === "children") {
            ["name", "avatar", "age", "independenceAge", "ageGroup"].forEach(function (f) {
              if (x[f] !== undefined && cur[f] !== x[f]) { cur[f] = x[f]; updated++; }
            });
          }
        }
      });
    }
    ["children", "goals", "tasks", "ledger", "devices", "processedOps"].forEach(mergeArr);

    /* events union by (e,ts); activity union by (ts,text) — entries have no ids;
     * boxes & rules: newer export wins */
    var evIndex = {};
    (S.events || []).forEach(function (e) { evIndex[e.e + "|" + e.ts] = 1; });
    (d.events || []).forEach(function (e) {
      if (!evIndex[e.e + "|" + e.ts]) { (S.events = S.events || []).push(e); added++; }
    });
    /* activity history has no ids: union by (ts|text), newest-first, cap 40 */
    var actSeen = {};
    (S.activity || []).forEach(function (a) { if (a) actSeen[a.ts + "|" + a.text] = 1; });
    (d.activity || []).forEach(function (a) {
      if (a && !actSeen[a.ts + "|" + a.text]) { (S.activity = S.activity || []).push(a); added++; }
    });
    S.activity = (S.activity || []).sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); }).slice(0, 40);
    if ((snap.exportedAt || 0) >= (S.rolesLastImportAt || 0)) {
      ["boxes", "splitRule", "perms"].forEach(function (k) {
        if (d[k] !== undefined) S[k] = d[k];
      });
      S.rolesLastImportAt = snap.exportedAt;
    }
    /* parentAuth (hash+salt only, never plaintext): newer setAt wins, so a
     * paired child device receives the parent code for temp-unlock + unbind */
    if (d.parentAuth && d.parentAuth.hash) {
      var curPa = S.parentAuth;
      if (!curPa || !curPa.hash || (d.parentAuth.setAt || 0) >= (curPa.setAt || 0)) {
        S.parentAuth = {
          salt: d.parentAuth.salt,
          hash: d.parentAuth.hash,
          setAt: d.parentAuth.setAt || 0,
          fail: 0, lockUntil: 0
        };
      }
    }
    /* subscription stays local (device/account level) — never imported */
    var bc = this.boundChild();
    if (this.isChildDevice()) {
      if (bc) { S.activeChildId = bc.id; S.mode = "kids"; }
    }
    save();
    /* rebuild balances from the merged ledger so they can never drift */
    try {
      (S.children || []).forEach(function (c) { if (typeof rebuildBalances === "function") rebuildBalances(c); });
    } catch (e) {}
    return { ok: true, added: added, updated: updated };
  } catch (e) {
    return { ok: false, err: "upg.r.import_bad" };
  }
};

Roles.importSnapshotText = function (text) {
  var snap = null;
  try { snap = JSON.parse(String(text || "").trim()); } catch (e) { snap = null; }
  if (!snap) return { ok: false, err: "upg.r.import_bad" };
  return this.importSnapshot(snap);
};

/* ---------- 6. Wiring: mode enforcement + guards ---------- */
/* renderApp override: effective mode + forced child binding + parent banner */
renderApp = function () {
  document.documentElement.setAttribute("data-theme", S.dark ? "dark" : "light");
  document.documentElement.setAttribute("dir", LANG === "he" ? "rtl" : "ltr");
  document.documentElement.setAttribute("lang", LANG);
  var bc = Roles.boundChild();
  if (Roles.isChildDevice() && bc && S.activeChildId !== bc.id) S.activeChildId = bc.id;
  var mode = Roles.effectiveMode();
  var root = document.getElementById("app");
  var screen = "";
  if (mode === "parent") {
    screen =
      S.tab === "home" ? parentHome() :
      S.tab === "guide" ? parentGuide() :
      S.tab === "games" ? parentGames() :
      S.tab === "tasks" ? parentTasks() :
      parentManage();
  } else {
    screen =
      S.tab === "tasks" ? kidsTasks() :
      S.tab === "games" ? kidsGames() :
      kidsHome();
  }
  root.innerHTML = RolesUI.parentBanner() + renderHeader() + screen + renderNav();
  if (S.tab === "guide" && mode === "parent" && canAccessGuidance()) renderChat();
  save();
};

/* renderHeader override: mirrors base markup 1:1; on a locked child device
 * the mode toggle is replaced by a lock button (parent code to unlock). */
renderHeader = function () {
  var child = activeChild();
  var name = child ? esc(child.name) : t("header.family");
  var modeHtml;
  if (Roles.isChildDevice() && !Roles.parentUnlocked()) {
    modeHtml = '<button class="roles-lock-btn" onclick="RolesUI.openParentUnlock()" ' +
      'aria-label="' + esc(t("upg.r.unlock_title")) + '">🔒 ' + esc(t("mode.parent")) + "</button>";
  } else {
    var m = Roles.effectiveMode();
    modeHtml = '<div class="mode-toggle" role="tablist" aria-label="' + esc(t("mode.aria")) + '">' +
      '<button class="' + (m === "parent" ? "active" : "") + '" onclick="A.setMode(\'parent\')">' +
      esc(t("mode.parent")) + "</button>" +
      '<button class="' + (m === "kids" ? "active" : "") + '" onclick="A.setMode(\'kids\')">' +
      esc(t("mode.kids")) + "</button></div>";
  }
  return '<header class="app-header"><div>' +
    '<div class="family-label">' + esc(t("header.family")) + "</div>" +
    '<h1 class="family-name">' + name + "</h1></div>" +
    '<div class="header-toggles">' +
    '<div class="lang-toggle" role="tablist" aria-label="' + esc(t("lang.aria")) + '">' +
    '<button class="' + (LANG === "he" ? "active" : "") + '" onclick="A.setLang(\'he\')">עב</button>' +
    '<button class="' + (LANG === "ru" ? "active" : "") + '" onclick="A.setLang(\'ru\')">РУ</button></div>' +
    modeHtml + "</div></header>";
};

/* renderNav override: tabs follow the effective mode, not the stored one */
renderNav = function () {
  var mode = Roles.effectiveMode();
  var tabs = mode === "parent" ? PARENT_TABS : KIDS_TABS;
  return '<nav class="bottom-nav">' + tabs.map(function (tb) {
    return '<button class="nav-btn' + (S.tab === tb.id ? " active" : "") +
      '" onclick="A.go(\'' + tb.id + '\')"><span class="nav-ico">' + tb.icon +
      '</span><span class="nav-lbl">' + esc(tabLabel(tb.id)) + "</span></button>";
  }).join("") + "</nav>";
};

/* ---------- 7. Guards on A.* actions (defense in depth: UI + logic) ---------- */
(function rolesGuardActions() {
  if (typeof A === "undefined") return;

  function wrap(name, fn) {
    var f = A[name];
    if (typeof f !== "function") return;
    A[name] = function () {
      if (!fn.apply(null, arguments)) return;
      return f.apply(this, arguments);
    };
  }
  function parentOnly() {
    var names = Array.prototype.slice.call(arguments);
    names.forEach(function (n) {
      wrap(n, function () { return Roles.requireParent(); });
    });
  }

  /* --- mode / navigation --- */
  var __setMode = A.setMode;
  A.setMode = function (mode) {
    if (Roles.isChildDevice() && !Roles.parentUnlocked() && mode === "parent") {
      RolesUI.openParentUnlock();
      return;
    }
    return __setMode.call(this, mode);
  };
  var __go = A.go;
  A.go = function (tab) {
    if (Roles.isChildDevice() && !Roles.parentUnlocked()) {
      var kidsTabs = ["home", "tasks", "games"];
      if (kidsTabs.indexOf(tab) < 0) { RolesUI.openParentUnlock(); return; }
    }
    return __go.call(this, tab);
  };
  var __selectChild = A.selectChild;
  if (typeof __selectChild === "function") {
    A.selectChild = function (id) {
      if (!Roles.childScopeOk(id)) return;
      return __selectChild.call(this, id);
    };
  }

  /* --- parent-only: family management, money in, settings, subscription --- */
  parentOnly(
    "createChild", "openAddMoney", "doAddMoney",
    "openSplitModal", "doSaveSplit",
    "openBoxesModal", "doSaveBoxes",
    "openInvestRuleModal", "doSaveInvestRule", "applyInvestMatch",
    "openLedgerModal", "askCorrectTx", "doCorrectTx",
    "openTaskModal", "doCreateTask", "createTask",
    "approveTask", "rejectTask", "confirmRejectTask",
    "approveMission", "skipMission",
    "openSubscription", "activateWithCode",
    "resetAll", "openDeleteModal",
    "careStartTrial", "careRequestSub", "careActivateCode", "careExportData",
    "toggleMainGoal", "setMainGoal"
  );

  /* --- child-scoped: the child may act only on their own data --- */
  function ownChildOfTask(taskId) {
    var tsk = (S.tasks || []).filter(function (x) { return x.id === taskId; })[0];
    return tsk ? tsk.childId : null;
  }
  function ownChildOfGoal(goalId) {
    var g = (S.goals || []).filter(function (x) { return x.id === goalId; })[0];
    return g ? g.childId : null;
  }

  /* goals: parent always; child only when eligible AND family allows it */
  ["openGoal", "doCreateGoal"].forEach(function (n) {
    var f = A[n];
    if (typeof f !== "function") return;
    A[n] = function (childId) {
      if (Roles.isChildDevice() && !Roles.parentUnlocked()) {
        var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
        if (!Roles.childScopeOk(childId)) return;
        if (!Roles.childCanSelfEnter(c) || !(S.perms && S.perms.childCanCreateGoals)) {
          toast(t("upg.r.perm_denied")); return;
        }
      }
      return f.apply(this, arguments);
    };
  });

  /* deposit to goal: parent always; child only for their own goal when eligible */
  ["openDeposit", "doDeposit"].forEach(function (n) {
    var f = A[n];
    if (typeof f !== "function") return;
    A[n] = function (goalId) {
      if (Roles.isChildDevice() && !Roles.parentUnlocked()) {
        var cid = ownChildOfGoal(goalId);
        var c = (S.children || []).filter(function (x) { return x.id === cid; })[0];
        if (!Roles.childScopeOk(cid)) return;
        if (!Roles.childCanSelfEnter(c)) { toast(t("upg.r.perm_denied")); return; }
      }
      return f.apply(this, arguments);
    };
  });

  /* completeTask / doneMission: child only for their own tasks */
  ["completeTask", "doneMission"].forEach(function (n) {
    var f = A[n];
    if (typeof f !== "function") return;
    A[n] = function (id) {
      if (Roles.isChildDevice() && !Roles.parentUnlocked()) {
        if (!Roles.childScopeOk(ownChildOfTask(id))) return;
      }
      return f.apply(this, arguments);
    };
  });
})();

/* ---------- 8. Child self-entry: add money (smart split, by:"child") ---------- */
Roles.openChildAddMoney = function (childId) {
  RolesUI.openChildAddMoney(childId);
};

Roles.doChildAddMoney = function (childId) {
  var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
  if (!c) return;
  if (Roles.isChildDevice() && !Roles.parentUnlocked()) {
    if (!Roles.childScopeOk(childId)) return;
    if (!Roles.childCanSelfEnter(c)) { toast(t("upg.r.perm_denied")); return; }
  }
  var amountAg = upgParseAg("rcAmount");
  var boxes = upgActiveBoxes();
  if (amountAg == null || amountAg <= 0 || !boxes.length) {
    toast(t(boxes.length ? "upg.m.am_bad" : "upg.m.am_no_boxes"));
    return;
  }
  var srcEl = document.getElementById("rcSource");
  var source = srcEl ? srcEl.value : "other";
  var parts = upgSmartSplit(amountAg, boxes).filter(function (p) { return p.ag > 0; });
  if (!parts.length) { toast(t("upg.m.am_bad")); return; }
  var btn = document.getElementById("rcConfirm");
  if (btn) btn.disabled = true;
  var opId = (document.getElementById("rcOpId") || {}).value || uid();
  var by = Roles.isChildDevice() ? "child" : "parent";
  var applied = onceOp("childadd-" + opId, function () {
    parts.forEach(function (p) {
      addTx({ childId: childId, boxId: p.id, amountAg: p.ag, type: "income", source: source, note: "", by: by });
    });
    rebuildBalances(c);
    Roles.logChildTx(c, amountAg, source);
    return true;
  });
  save();
  A.closeModal();
  renderApp();
  if (applied) toast(t("upg.r.child_added"));
};

/* ---------- 9. Parent-only: delete a transaction ---------- */
/* Removes the ledger entry and rebuilds balances from the ledger, so money
 * can never drift. For goal deposits it also rolls back goal.saved.
 * Idempotent: deleting an already-deleted tx is a silent no-op. */
Roles.deleteTx = function (txId) {
  if (!this.requireParent()) return false;
  var idx = (S.ledger || []).findIndex(function (e) { return e.id === txId; });
  if (idx < 0) return false;
  var tx = S.ledger[idx];
  if (tx.type === "transfer" && tx.source === "goal_deposit") {
    var g = (S.goals || []).filter(function (x) {
      return x.childId === tx.childId && x.title === tx.note;
    })[0];
    if (g) g.saved = Math.max(0, (g.saved || 0) + tx.amountAg); /* amountAg is negative */
  }
  S.ledger.splice(idx, 1);
  var c = (S.children || []).filter(function (x) { return x.id === tx.childId; })[0];
  if (c && typeof rebuildBalances === "function") rebuildBalances(c);
  try {
    var srcKey = "upg.m.src_" + (tx.source || "other");
    var srcLabel = t(srcKey); if (srcLabel === srcKey) srcLabel = tx.source;
    logActivity(t("upg.r.audit_tx_deleted", fmtAg(Math.abs(tx.amountAg)), srcLabel));
  } catch (e) {}
  save();
  return true;
};

</script>
<script>
/* ===== chunk js: 51-roles-ui ===== */
/* ============================================================
   51 — Parent Mode + Child Mode (UI)
   Modals, manage-tab section, kids self-entry button.
   Depends on: 50-roles core (Roles), base app (openModal, toast, t, esc).
   ============================================================ */

var RolesUI = {
  /* ----- banner shown on a child device while parent is unlocked ----- */
  parentBanner: function () {
    if (Roles.isChildDevice() && Roles.parentUnlocked()) {
      return '<div class="roles-banner">🔓 ' + esc(t("upg.r.temp_parent")) +
        ' <button class="btn small" onclick="Roles.lockParent();renderApp();">' +
        esc(t("upg.r.back_to_child")) + "</button></div>";
    }
    return "";
  },

  /* ----- parent unlock (child device) ----- */
  openParentUnlock: function () {
    if (!Roles.hasParentCode()) {
      openModal("<h3>" + esc(t("upg.r.unlock_title")) + "</h3>" +
        '<p class="muted">' + esc(t("upg.r.code_not_set_yet")) + "</p>" +
        '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
      return;
    }
    openModal("<h3>" + esc(t("upg.r.unlock_title")) + "</h3>" +
      '<p class="muted">' + esc(t("upg.r.unlock_hint")) + "</p>" +
      '<div class="field"><input id="ruCode" type="password" inputmode="numeric" autocomplete="off" ' +
      'placeholder="••••" style="text-align:center;font-size:24px;letter-spacing:8px"></div>' +
      '<div id="ruErr" class="upg-err" style="display:none"></div>' +
      '<button class="btn" onclick="RolesUI.doUnlock()">' + esc(t("upg.r.code_verify")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
    setTimeout(function () { var el = document.getElementById("ruCode"); if (el) el.focus(); }, 50);
  },

  doUnlock: function () {
    var code = (document.getElementById("ruCode") || {}).value || "";
    var r = Roles.verifyParentCode(code);
    var errEl = document.getElementById("ruErr");
    function err(key) {
      if (errEl) { errEl.textContent = t(key); errEl.style.display = ""; }
      else toast(t(key));
    }
    if (r === true) {
      if (Roles.unlockParent() === false) return;
      A.closeModal();
      renderApp();
      toast(t("upg.r.unlock_ok"));
    } else if (r === "locked") { err("upg.r.code_locked"); }
    else { err("upg.r.code_wrong"); }
  },

  /* ----- parent code set / change (parent scope only) ----- */
  openSetParentCode: function () {
    if (!Roles.requireParent()) return;
    var has = Roles.hasParentCode();
    openModal("<h3>" + esc(t("upg.r.parent_code_title")) + "</h3>" +
      '<p class="muted">' + esc(t("upg.r.parent_code_hint")) + "</p>" +
      (has ? '<div class="field"><label>' + esc(t("upg.r.code_current")) + '</label>' +
        '<input id="rcCur" type="password" inputmode="numeric" autocomplete="off"></div>' : "") +
      '<div class="field"><label>' + esc(t("upg.r.code_new")) + '</label>' +
      '<input id="rcNew" type="password" inputmode="numeric" autocomplete="off" placeholder="4-8"></div>' +
      '<div id="rcErr" class="upg-err" style="display:none"></div>' +
      '<button class="btn" onclick="RolesUI.doSetParentCode()">' + esc(t("upg.m.common_save")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
  },

  doSetParentCode: function () {
    var errEl = document.getElementById("rcErr");
    function err(key) {
      if (errEl) { errEl.textContent = t(key); errEl.style.display = ""; }
      else toast(t(key));
    }
    if (Roles.hasParentCode()) {
      var cur = (document.getElementById("rcCur") || {}).value || "";
      if (Roles.verifyParentCode(cur) !== true) { err("upg.r.code_wrong"); return; }
    }
    var res = Roles.setParentCode((document.getElementById("rcNew") || {}).value || "");
    if (!res.ok) { err(res.err); return; }
    A.closeModal();
    renderApp();
    toast(t("upg.r.code_saved"));
  },

  /* ----- child age + independence age (parent scope only) ----- */
  openChildAge: function (childId) {
    if (!Roles.requireParent()) return;
    var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
    if (!c) return;
    openModal("<h3>" + esc(c.name) + "</h3>" +
      '<div class="field"><label>' + esc(t("upg.r.child_age")) + '</label>' +
      '<input id="raAge" type="number" min="3" max="18" inputmode="numeric" value="' +
      (c.age != null ? c.age : "") + '" placeholder="—"></div>' +
      '<div class="field"><label>' + esc(t("upg.r.independence_age")) + '</label>' +
      '<input id="raInd" type="number" min="3" max="18" inputmode="numeric" value="' +
      (c.independenceAge != null ? c.independenceAge : "") +
      '" placeholder="' + esc(t("upg.r.independence_off")) + '"></div>' +
      '<p class="muted">' + esc(t("upg.r.independence_hint")) + "</p>" +
      '<button class="btn" onclick="RolesUI.doSaveChildAge(\'' + childId + "')\">" +
      esc(t("upg.m.common_save")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
  },

  doSaveChildAge: function (childId) {
    if (!Roles.requireParent()) return;
    var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
    if (!c) return;
    function num(id) {
      var el = document.getElementById(id);
      if (!el) return null;
      var raw = String(el.value == null ? "" : el.value).trim();
      if (raw === "") return null;
      var n = Math.round(Number(raw));
      if (!isFinite(n) || n < 3 || n > 18) return -1;
      return n;
    }
    var age = num("raAge"), ind = num("raInd");
    if (age === -1 || ind === -1) { toast(t("upg.r.age_bad")); return; }
    c.age = age;
    c.independenceAge = ind;
    save();
    A.closeModal();
    renderApp();
    toast(t("upg.r.saved"));
  },

  /* ----- device connection ----- */
  openIssueDevice: function () {
    if (!Roles.requireParent()) return;
    var kids = S.children || [];
    if (!kids.length) { toast(t("kids.no_child")); return; }
    var opts = kids.map(function (c) {
      return '<option value="' + c.id + '">' + esc(c.name) + "</option>";
    }).join("");
    openModal("<h3>" + esc(t("upg.r.connect_title")) + "</h3>" +
      '<div class="field"><label>' + esc(t("upg.r.connect_child")) + "</label>" +
      '<select id="riChild">' + opts + "</select></div>" +
      '<button class="btn" onclick="RolesUI.doIssueDevice()">' + esc(t("upg.r.connect_issue")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>" +
      '<div id="riOut"></div>');
  },

  doIssueDevice: function () {
    var childId = (document.getElementById("riChild") || {}).value;
    var rec = Roles.issueDeviceCode(childId);
    if (!rec) return;
    var out = document.getElementById("riOut");
    var dt = new Date(rec.expiresAt).toLocaleString(appLocale());
    if (out) {
      out.innerHTML = '<div class="roles-code-box"><div class="muted">' +
        esc(t("upg.r.connect_code")) + '</div><div class="roles-code">' + esc(rec.code) +
        '</div><div class="muted small">' + esc(t("upg.r.connect_valid_until", dt)) + "</div>" +
        '<p class="muted">' + esc(t("upg.r.connect_code_hint")) + "</p></div>";
    }
  },

  openRedeemDevice: function () {
    openModal("<h3>" + esc(t("upg.r.connect_redeem_title")) + "</h3>" +
      '<p class="muted">' + esc(t("upg.r.import_hint")) + "</p>" +
      '<div class="field"><textarea id="rrImport" rows="4" placeholder="{...}"></textarea></div>' +
      '<button class="btn secondary" onclick="RolesUI.doImportRedeem()">' + esc(t("upg.r.import_do")) + "</button>" +
      '<hr><p class="muted">' + esc(t("upg.r.connect_redeem_hint")) + "</p>" +
      '<div class="field"><input id="rrCode" placeholder="ABC123" ' +
      'style="text-align:center;font-size:22px;letter-spacing:4px;text-transform:uppercase"></div>' +
      '<div id="rrErr" class="upg-err" style="display:none"></div>' +
      '<button class="btn" onclick="RolesUI.doRedeem()">' + esc(t("upg.r.connect_redeem_go")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
  },

  doImportRedeem: function () {
    var txt = (document.getElementById("rrImport") || {}).value || "";
    var r = Roles.importSnapshotText(txt);
    if (!r.ok) { toast(t(r.err)); return; }
    toast(t("upg.r.import_ok", r.added));
  },

  doRedeem: function () {
    var errEl = document.getElementById("rrErr");
    var code = (document.getElementById("rrCode") || {}).value || "";
    var r = Roles.redeemDeviceCode(code);
    if (!r.ok) {
      if (errEl) { errEl.textContent = t(r.err); errEl.style.display = ""; }
      else toast(t(r.err));
      return;
    }
    A.closeModal();
    renderApp();
    var c = (S.children || []).filter(function (x) { return x.id === r.childId; })[0];
    toast(t("upg.r.connect_ok", c ? c.name : ""));
  },

  /* ----- this device: unbind back to parent (code-gated on child device) ----- */
  openUnbind: function () {
    if (Roles.isChildDevice() && !Roles.parentUnlocked()) {
      this.openParentUnlock();
      toast(t("upg.r.unbind_need_code"));
      return;
    }
    if (confirm(t("upg.r.unbind_confirm"))) {
      Roles.unbindThisDevice();
      renderApp();
    }
  },

  /* ----- export / import ----- */
  openExport: function () {
    if (!Roles.requireParent()) return;
    var txt = Roles.exportSnapshotText() || "";
    openModal("<h3>" + esc(t("upg.r.export_title")) + "</h3>" +
      '<p class="muted">' + esc(t("upg.r.export_hint")) + "</p>" +
      '<div class="field"><textarea id="reText" rows="8" readonly>' + esc(txt) + "</textarea></div>" +
      '<button class="btn" onclick="RolesUI.doCopyExport()">' + esc(t("upg.r.export_copy")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
  },

  doCopyExport: function (taId) {
    var el = document.getElementById(taId || "reText");
    function done() { toast(t("upg.r.export_copied")); }
    if (el && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el.value).then(done, function () { el.select(); done(); });
    } else if (el) { el.select(); try { document.execCommand("copy"); } catch (e) {} done(); }
  },

  /* ----- child self export (locked child device): own data only ----- */
  openChildExport: function () {
    var txt = Roles.exportSnapshotText() || "";
    if (!txt) { toast(t("upg.r.perm_denied")); return; }
    openModal("<h3>" + esc(t("upg.r.my_export")) + "</h3>" +
      '<p class="muted">' + esc(t("upg.r.child_export_hint")) + "</p>" +
      '<div class="field"><textarea id="rceText" rows="8" readonly>' + esc(txt) + "</textarea></div>" +
      '<button class="btn" onclick="RolesUI.doCopyChildExport()">' + esc(t("upg.r.export_copy")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
  },

  doCopyChildExport: function () {
    this.doCopyExport("rceText");
  },

  openImport: function () {
    if (!Roles.requireParent()) return;
    openModal("<h3>" + esc(t("upg.r.import_title")) + "</h3>" +
      '<p class="muted">' + esc(t("upg.r.import_hint")) + "</p>" +
      '<div class="field"><textarea id="riText" rows="8" placeholder="{...}"></textarea></div>' +
      '<div id="riErr" class="upg-err" style="display:none"></div>' +
      '<button class="btn" onclick="RolesUI.doImport()">' + esc(t("upg.r.import_do")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
  },

  doImport: function () {
    var txt = (document.getElementById("riText") || {}).value || "";
    var r = Roles.importSnapshotText(txt);
    var errEl = document.getElementById("riErr");
    if (!r.ok) {
      if (errEl) { errEl.textContent = t(r.err); errEl.style.display = ""; }
      else toast(t(r.err));
      return;
    }
    A.closeModal();
    renderApp();
    toast(t("upg.r.import_ok", r.added));
  },

  /* ----- child self-entry modal ----- */
  openChildAddMoney: function (childId) {
    var c = (S.children || []).filter(function (x) { return x.id === childId; })[0];
    if (!c) return;
    if (Roles.isChildDevice() && !Roles.parentUnlocked()) {
      if (!Roles.childScopeOk(childId)) return;
      if (!Roles.childCanSelfEnter(c)) {
        toast(t("upg.r.child_not_eligible", c.independenceAge));
        return;
      }
    }
    var opId = uid();
    var srcOpts = UpgMoney.SOURCES.map(function (s) {
      return '<option value="' + s + '">' + esc(t("upg.m.src_" + s)) + "</option>";
    }).join("");
    openModal("<h3>" + esc(t("upg.r.child_add_title")) + "</h3>" +
      '<input type="hidden" id="rcOpId" value="' + opId + '">' +
      '<div class="field"><label>' + esc(t("upg.r.child_add_amount")) + '</label>' +
      '<input id="rcAmount" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0"></div>' +
      '<div class="field"><label>' + esc(t("upg.r.child_add_source")) + "</label>" +
      '<select id="rcSource">' + srcOpts + "</select></div>" +
      '<button class="btn" id="rcConfirm" onclick="Roles.doChildAddMoney(\'' + childId + "')\">" +
      esc(t("upg.r.child_add_go")) + "</button> " +
      '<button class="btn secondary" onclick="A.closeModal()">' + esc(t("upg.m.common_cancel")) + "</button>");
    setTimeout(function () { var el = document.getElementById("rcAmount"); if (el) el.focus(); }, 50);
  },

  /* ----- history view (parent): who / what / when / amount / source ----- */
  historyHtml: function (childId) {
    var rows = Roles.historyFor(childId, 20);
    if (!rows.length) return '<div class="empty">' + esc(t("upg.r.history_empty")) + "</div>";
    return rows.map(function (e) {
      var byIcon = e.by === "child" ? "🧒" : "👩";
      var srcKey = "upg.m.src_" + (e.source || "other");
      var srcLabel = t(srcKey); if (srcLabel === srcKey) srcLabel = e.source;
      var dt = new Date(e.ts || Date.now()).toLocaleString(appLocale());
      var amt = (e.amountAg < 0 ? "−" : "+") + fmtAg(Math.abs(e.amountAg));
      return '<div class="row-item"><div class="icon-badge">' + byIcon + '</div>' +
        '<div class="grow"><div style="font-weight:700">' + esc(amt) + '</div>' +
        '<div class="sub">' + esc(srcLabel) + " · " + esc(dt) + "</div></div>" +
        '<button class="btn small secondary" onclick="RolesUI.doDeleteTx(\'' + e.id + "')\" " +
        'aria-label="🗑">🗑</button></div>';
    }).join("");
  },

  /* ----- manage-tab section (appended to parentManage) ----- */
  rolesSectionHtml: function () {
    var h = '<div class="card roles-card"><div class="section-title">🔐 ' +
      esc(t("upg.r.roles_title")) + "</div>";

    /* this device */
    var devBadge = Roles.isChildDevice()
      ? "🧒 " + esc(t("upg.r.device_child")) + (Roles.boundChild() ? " · " + esc(Roles.boundChild().name) : "")
      : "👩 " + esc(t("upg.r.device_parent"));
    h += '<div class="roles-row"><div><b>' + esc(t("upg.r.this_device")) + ":</b> " + devBadge + "</div><div class=\"roles-btns\">";
    if (Roles.isChildDevice()) {
      h += '<button class="btn small secondary" onclick="RolesUI.openUnbind()">' +
        esc(t("upg.r.set_as_parent_device")) + "</button>";
    } else {
      h += '<button class="btn small secondary" onclick="RolesUI.openRedeemDevice()">' +
        esc(t("upg.r.set_as_child_device")) + "</button>";
    }
    h += "</div></div>";

    /* parent code */
    h += '<div class="roles-row"><div><b>' + esc(t("upg.r.parent_code_title")) + ":</b> " +
      (Roles.hasParentCode()
        ? '<span class="upg-badge">✅ ' + esc(t("upg.r.parent_code_is_set")) + "</span>"
        : '<span class="muted">' + esc(t("upg.r.parent_code_not_set")) + "</span>") +
      '<div class="muted small">' + esc(t("upg.r.parent_code_hint")) + "</div></div>" +
      '<div class="roles-btns"><button class="btn small" onclick="RolesUI.openSetParentCode()">' +
      esc(Roles.hasParentCode() ? t("upg.r.parent_code_change") : t("upg.r.parent_code_set")) +
      "</button></div></div>";

    /* per-child: age + independence age + connect */
    (S.children || []).forEach(function (c) {
      var elig = Roles.childCanSelfEnter(c);
      h += '<div class="roles-row"><div><b>' + esc(c.name) + "</b> " +
        '<span class="muted small">' + esc(t("upg.r.child_age")) + ": " +
        (c.age != null ? c.age : "—") + " · " + esc(t("upg.r.independence_age")) + ": " +
        (c.independenceAge != null ? c.independenceAge : esc(t("upg.r.independence_off"))) +
        (elig ? ' · <span class="upg-badge">✅</span>' : "") + "</span></div>" +
        '<div class="roles-btns"><button class="btn small secondary" onclick="RolesUI.openChildAge(\'' + c.id + "')\">" +
        esc(t("upg.r.child_age_edit")) + "</button> " +
        '<button class="btn small secondary" onclick="RolesUI.openIssueDevice()">' +
        esc(t("upg.r.connect_issue")) + "</button></div></div>";
    });

    /* connected devices */
    var devs = (S.devices || []).filter(function (d) { return !d.revoked; });
    h += '<div class="roles-row"><div><b>' + esc(t("upg.r.devices_title")) + "</b> (" + devs.length + ")</div></div>";
    if (!devs.length) {
      h += '<div class="muted small">' + esc(t("upg.r.no_devices")) + "</div>";
    } else {
      h += devs.map(function (d) {
        var st = d.redeemed ? "✅" : "⏳";
        var dt = new Date(d.issuedAt).toLocaleDateString(appLocale());
        return '<div class="roles-row"><div>' + st + " <b>" + esc(d.childName || "") + "</b> " +
          '<span class="muted small">' + esc(dt) + ' · <span dir="ltr">' + esc(d.code) + "</span></span></div>" +
          '<div class="roles-btns"><button class="btn small secondary" onclick="RolesUI.doRevokeDevice(\'' + d.id + "')\">" +
          esc(t("upg.r.device_revoke")) + "</button></div></div>";
      }).join("");
    }

    /* export / import */
    h += '<div class="roles-row"><div><b>' + esc(t("upg.r.sync_title")) + "</b>" +
      '<div class="muted small">' + esc(t("upg.r.sync_hint")) + "</div></div>" +
      '<div class="roles-btns"><button class="btn small" onclick="RolesUI.openExport()">' +
      esc(t("upg.r.export_title")) + "</button> " +
      '<button class="btn small secondary" onclick="RolesUI.openImport()">' +
      esc(t("upg.r.import_title")) + "</button></div></div>";

    /* honesty note */
    h += '<div class="roles-note">ℹ️ ' + esc(t("upg.r.security_note")) + "</div>";

    /* history for active child */
    var ac = activeChild();
    if (ac) {
      h += '<div class="section-title" style="margin-top:12px">🧾 ' +
        esc(t("upg.r.history_title")) + " · " + esc(ac.name) + "</div>" +
        this.historyHtml(ac.id);
    }
    h += "</div>";
    return h;
  },

  doRevokeDevice: function (id) {
    if (Roles.revokeDevice(id)) { renderApp(); toast(t("upg.r.device_revoked")); }
  },

  doDeleteTx: function (txId) {
    if (!Roles.requireParent()) return;
    if (!confirm(t("upg.r.tx_delete_confirm"))) return;
    if (Roles.deleteTx(txId)) { renderApp(); toast(t("upg.r.tx_deleted")); }
  }
};
window.RolesUI = RolesUI;

/* ----- wire into the app ----- */
(function rolesWireUI() {
  /* manage tab: append the roles section (parent screens only reach manage in parent mode) */
  var __pm = parentManage;
  parentManage = function () {
    return __pm() + RolesUI.rolesSectionHtml();
  };

  /* kids home: self-entry button for eligible children */
  var __kh = kidsHome;
  kidsHome = function () {
    var h = __kh();
    try {
      var child = activeChild();
      if (child && Roles.childCanSelfEnter(child)) {
        var btn = '<div class="card roles-selfentry"><button class="btn" onclick="RolesUI.openChildAddMoney(\'' +
          child.id + "')\">💰 " + esc(t("upg.r.child_add_money")) + "</button></div>";
        h = h.replace('<div class="card dark">', btn + '<div class="card dark">');
      }
      /* locked child device: let the child export their own data for the parent */
      if (Roles.isChildDevice() && !Roles.parentUnlocked() && Roles.boundChild()) {
        var syncCard = '<div class="card roles-selfentry"><button class="btn secondary" onclick="RolesUI.openChildExport()">📤 ' +
          esc(t("upg.r.my_export")) + "</button></div>";
        var anchor = '<div class="card dark">';
        h = h.indexOf(anchor) >= 0 ? h.replace(anchor, syncCard + anchor) : h + syncCard;
      }
    } catch (e) {}
    return h;
  };
})();

</script>
